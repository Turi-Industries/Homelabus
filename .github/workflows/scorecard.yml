name: Scorecard

# OpenSSF Scorecard: the repository's supply chain as an outsider reads it — pinned
# actions, token permissions, signed releases, the rules on `main`. Results go to code
# scanning and to scorecard.dev, which serves the badge. Both are for public
# repositories only: while this one is private the job is skipped.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    if: ${{ github.event.repository.private != true }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
