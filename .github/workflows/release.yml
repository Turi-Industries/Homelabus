name: Release

# `hlb` for a machine with no Rust toolchain, on a version tag — the same tag
# `images.yml` builds the images from: `git tag v0.3.0 && git push origin v0.3.0`.
#
#   hlb-x86_64-unknown-linux-musl     static binaries, one per architecture
#   hlb-aarch64-unknown-linux-musl
#   SHA256SUMS                        their checksums
#   SHA256SUMS.sigstore.json          cosign's keyless signature of SHA256SUMS, made with
#                                     this workflow's GitHub identity: no key to keep
#   install.sh                        verifies that signature and the checksum, then installs
#
# and a build provenance attestation per binary: `gh attestation verify hlb-… -R <repo>`.
# Written by hand rather than generated by cargo-dist, whose workflow names its actions
# by tag: every action here is pinned by commit, like the rest of CI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          # Native runners: no cross toolchain, and the binary built is run below.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      # ring, SQLite and zlib are C, compiled for musl by its own compiler. Named for
      # both targets: `cc` looks for `aarch64-linux-musl-gcc`, which Ubuntu does not ship.
      - name: musl's C compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p hlb-cli --target ${{ matrix.target }}

      # A binary that still needs the runner's glibc would install everywhere and start
      # nowhere older: refused here rather than on someone's machine.
      - name: Static, and it runs
        run: |
          bin="target/${{ matrix.target }}/release/hlb"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          "$bin" --version | grep -qx "hlb ${GITHUB_REF_NAME#v}"
          mkdir dist
          cp "$bin" "dist/hlb-${{ matrix.target }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hlb-${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hlb-${{ matrix.target }}
          path: dist/hlb-${{ matrix.target }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-26.04
    # It can push: so it checks nothing out and runs no code of the repository — the
    # installer is read as a file, at the tag's commit.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: hlb-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Checksums, signed
        working-directory: dist
        run: |
          sha256sum hlb-* > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: The installer, at the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/install.sh?ref=$GITHUB_SHA" > dist/install.sh
          grep -q '^COSIGN_VERSION=' dist/install.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Named: with no checkout there is no `.git` for gh to find the repository in.
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes --title "$GITHUB_REF_NAME" dist/*

  # The release's own install.sh, run on a machine that never saw the build: the files
  # come from the published release, the signature is checked against this workflow.
  # Served locally because a private repository's assets need a token curl lacks.
  try:
    needs: release
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D release
      - name: Install it as anyone would, and refuse it tampered with
        run: |
          (cd release && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          HLB_RELEASE_URL=http://127.0.0.1:8765 HLB_INSTALL_DIR="$HOME/bin" sh release/install.sh
          "$HOME/bin/hlb" --version
          # Any byte added: replacing one could replace it with itself.
          echo "$(printf '0%.0s' $(seq 64))  hlb-other" >> release/SHA256SUMS
          if HLB_RELEASE_URL=http://127.0.0.1:8765 HLB_INSTALL_DIR="$HOME/other" sh release/install.sh; then
            echo "install.sh accepted a SHA256SUMS its signature does not cover" >&2
            exit 1
          fi
