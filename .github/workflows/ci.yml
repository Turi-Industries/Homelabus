name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job reads, none writes: a step compromised upstream gets a token that can push
# nothing. Each action is pinned by the commit its tag named — a tag can be moved to
# other code, a commit cannot.
permissions:
  contents: read

# A pull request pushed again makes its previous run worthless: cancelled, not finished.
# Never on main, where every commit keeps its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job names its image, as the other workflows do: `ubuntu-latest` moves to the next
# release on GitHub's date, and the browser job relies on the libraries this one ships.
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Integration tests are #[ignore]d on purpose: they need Docker, a live
      # registry, or a real controller. CI runs the unit suite, which needs nothing.
      - name: cargo test
        run: cargo test --workspace

  web:
    name: Interface
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # Against the lockfile, the advisories of the day: a dependency nobody changed can
      # become known-vulnerable between two pushes.
      # An advisory is ignored only with why it does not reach Homelabus, and comes back
      # the day that changes. GHSA-gcqx-w48m-w2h4, deepmerge's prototype poisoning: no
      # fixed version exists (4.3.1 is its last, 2023). Only `vite-plugin-svelte` takes
      # it, at build time, to merge this repository's own Svelte config — nothing in
      # `build/` carries it. Revisit when the plugin drops it or a fix is released.
      # GHSA-g3hv-75wg-m249, minimatch's globparts amplification: fixed in 11.0.1 only,
      # while `openapi-typescript` 7 holds `@redocly/openapi-core` to 1.x, which holds
      # minimatch to 5. It matches a reference's URL against a Redocly config's
      # patterns, and `generate` runs with no config over our own `openapi.json` — no
      # pattern comes from outside, nothing in `build/` carries it. Revisit when
      # `openapi-typescript` takes `@redocly/openapi-core` 2, which has no minimatch.
      - name: bun audit
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-g3hv-75wg-m249
      - name: bun run check
        run: bun run check
      - name: bun run test
        run: bun run test
      - name: bun run build
        run: bun run build

  browser:
    name: Interface in a browser
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # The revision `@playwright/test` pins, from its own lockfile entry, kept between
      # runs. Without `--with-deps`: the runner's preinstalled Chrome brought the
      # libraries already, and what apt added was fallback fonts the themes' own
      # typefaces never fall back to — whose mirror stalled 11 minutes on two runs of
      # three.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: bunx playwright install chromium
      # Starts a populated and an empty controller with `cargo run`, then walks them.
      - name: bun run test:browser
        run: bun run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # RustSec's own build, by its version and its digest: the auditor is code that
      # reads ours. Compiling it took 2m40s of every run.
      - name: Install cargo-audit
        env:
          VERSION: v0.22.2
          SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          name="cargo-audit-x86_64-unknown-linux-musl-$VERSION"
          curl -fsSLo "$RUNNER_TEMP/$name.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/$VERSION/$name.tgz"
          echo "$SHA256  $RUNNER_TEMP/$name.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tgz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$name/cargo-audit" ~/.cargo/bin/
      - name: cargo audit
        run: cargo audit

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo check
        run: cargo check --workspace --all-targets

  reuse:
    name: Licensing
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every file says who owns it and under what licence (REUSE.toml): a logo or a
      # key copied in without saying whose it is fails here, not in a takedown.
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
