name: Images

# The agent and the controller images `hlb fleet agent|controller --image …` deploy,
# and the ingress the catalog's `caddy` runs. Published on a version tag:
# `git tag v0.2.0 && git push origin v0.2.0`.
#
#   ghcr.io/<owner>/hlb-agent:<version>       and :latest
#   ghcr.io/<owner>/hlb-controller:<version>  and :latest
#   ghcr.io/<owner>/hlb-caddy:<version>       and :latest
#
# ⚠️ `catalog/_platform/caddy` names its image's version: a release changing the image
# moves that tag in the same commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        target: [agent, controller, caddy]
        platform: [linux/amd64, linux/arm64]
        include:
          # Native runners for each architecture: compiling the workspace under QEMU
          # emulation takes hours where it takes minutes natively.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hlb-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the tags are set once both architectures exist, so a
      # node never pulls a tag that has its build missing.
      #
      # No build cache. One written under a tag is read by that tag alone, never the
      # next: v0.2.0 left 5.5 GB nobody could use, and past the repository's 10 GB
      # GitHub evicts main's Rust caches, so CI went cold. A published image is not
      # built from layers another run wrote, either.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          # Of whichever repository built it: a fork's interface links to the fork.
          build-args: HLB_SOURCE=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Attached to the image itself, so they travel with it to any registry: what it
          # contains (SPDX, read from its layers) and how it was built.
          sbom: true
          provenance: mode=max

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: publish ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        target: [agent, controller, caddy]
    permissions:
      packages: write
      # The keyless signature's identity: this workflow, at this tag.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Image name and version
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hlb-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          # `v0.2.0` → `0.2.0`; a manual run without a tag publishes `edge`.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One tag for both architectures
        working-directory: /tmp/digests
        run: |
          image="${{ steps.name.outputs.image }}"
          version="${{ steps.name.outputs.version }}"
          tags=(-t "$image:$version")
          if [[ "$version" != edge ]]; then tags+=(-t "$image:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$version"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # The index both architectures hang from, by its digest: a tag moves, and signing
      # one would sign whatever it named at that instant. Checked as anyone would:
      #
      #   cosign verify ghcr.io/<owner>/hlb-agent:<version> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp \
      #       '^https://github.com/<owner>/<repo>/\.github/workflows/images\.yml@refs/tags/v'
      - name: Signed
        env:
          image: ${{ steps.name.outputs.image }}
          version: ${{ steps.name.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$image:$version" \
            --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$image@$digest"
          cosign verify "$image@$digest" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" >/dev/null
