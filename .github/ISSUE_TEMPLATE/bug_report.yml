name: Bug report
description: Something behaves differently from what it reports
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/Turi-Industries/Homelabus/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what came back.
      placeholder: |
        $ hlb backup status
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Does anything report success while not doing the work?
      description: >
        This project treats "an absence that looks like a success" as the worst class
        of bug — a green dashboard over a broken system. Those get priority.
      options:
        - "No — it fails visibly"
        - "Yes — something reports success, or stays green, while it is not doing the work"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "hlb 0.1.0, or commit sha"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker/Swarm version, number of nodes, and anything unusual.
      placeholder: |
        Debian 13, Docker 28.x, 3 nodes (2 managers)
        macOS host with colima — DOCKER_HOST is set
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact domains and tokens. Never paste the contents of your master key.
      render: shell
    validations:
      required: false
