# git-cliff writes CHANGELOG.md from the history: `git cliff --unreleased --prepend
# CHANGELOG.md` before a tag. The commits are sentences ("Refuse to build hlb around a
# catalog it could not read"), not Conventional Commits, so they are sorted by their
# first word rather than by a prefix nobody writes.

[changelog]
header = """
# Changelog

What changed in each release of Homelabus, newest first. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/) — before 1.0, a minor version may break.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^(Merge|Bump|Update the lockfile)", skip = true },
  { message = "(?i)^(fix|refuse|stop|correct|repair|close|keep .* from)", group = "<!-- 1 -->Fixed" },
  { message = "(?i)^(remove|drop|retire)", group = "<!-- 3 -->Removed" },
  { message = "(?i)^(add|link|release|offer|support|run|prove|restore|sign)", group = "<!-- 0 -->Added" },
  { message = ".*", group = "<!-- 2 -->Changed" },
]
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
