[workspace]
resolver = "2"
members = [
    "crates/hlb-types",
    "crates/hlb-orchestrator",
    "crates/hlb-resolver",
    "crates/hlb-catalog",
    "crates/hlb-ingress",
    "crates/hlb-platform",
    "crates/hlb-registry",
    "crates/hlb-secrets",
    "crates/hlb-state",
    "crates/hlb-engine",
    "crates/hlb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/remy/homelabus"

[workspace.dependencies]
# --- interne ---
hlb-types = { path = "crates/hlb-types" }
hlb-orchestrator = { path = "crates/hlb-orchestrator" }
hlb-resolver = { path = "crates/hlb-resolver" }
hlb-catalog = { path = "crates/hlb-catalog" }
hlb-ingress = { path = "crates/hlb-ingress" }
hlb-platform = { path = "crates/hlb-platform" }
hlb-registry = { path = "crates/hlb-registry" }
hlb-secrets = { path = "crates/hlb-secrets" }
hlb-state = { path = "crates/hlb-state" }
hlb-engine = { path = "crates/hlb-engine" }
hlb-cli = { path = "crates/hlb-cli" }

# --- runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "process", "time"] }
futures = "0.3"
async-trait = "0.1"

# --- docker / swarm ---
bollard = "0.19"

# --- état ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# --- sérialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = "1"

# --- erreurs / logs ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- cli ---
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# On veut être alerté sur les `unwrap` dans du code qui pilote des clusters.
unwrap_used = "warn"
expect_used = "warn"
