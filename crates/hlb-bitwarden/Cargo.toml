[package]
name = "hlb-bitwarden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vaultwarden client: an organisation's members, and the emergency vault's deposits — Bitwarden's client cryptography included."

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Bitwarden's client cryptography, the versions already in the workspace's tree.
aes = "0.9"
cbc = { version = "0.2", features = ["std"] }
argon2 = "0.6"
base64 = "0.23"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rand = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_yaml_ng.workspace = true
hlb-types.workspace = true

[lints]
workspace = true
