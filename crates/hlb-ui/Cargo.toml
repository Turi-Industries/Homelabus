[package]
name = "hlb-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tableau de bord egui : client de l'API du controller."

[lib]
name = "hlb_ui"
path = "src/lib.rs"
# `cdylib` pour la cible web : c'est le format que wasm-bindgen sait traiter.
# `rlib` reste nécessaire pour que le binaire natif et les tests puissent lier.
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Location", "History", "HtmlCanvasElement", "Storage"] }
console_error_panic_hook = "0.1"

[[bin]]
name = "hlb-ui"
path = "src/main.rs"

[dependencies]
hlb-api.workspace = true
hlb-types.workspace = true
egui = "0.33"
# `glow` plutôt que `wgpu` : le rendu OpenGL démarre partout, y compris dans une
# machine virtuelle ou en SSH avec redirection X11 — soit exactement les conditions
# d'un homelab. `wgpu` échoue à s'initialiser sur beaucoup de ces configurations.
# ⚠️ `x11` et `wayland` sont indispensables sur Linux : sans elles, winit refuse de
# compiler sur « The platform you're compiling for is not supported ». Elles sont sans
# effet sur macOS et Windows, d'où leur absence remarquée seulement en CI.
eframe = { version = "0.33", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# `ehttp` plutôt que `ureq` : il présente la MÊME API sur les deux cibles — threads
# natifs d'un côté, `fetch` du navigateur de l'autre. Une pile TLS native comme
# `ring` ne compile tout simplement pas pour wasm32.
ehttp = "0.5"
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
hlb-state.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
