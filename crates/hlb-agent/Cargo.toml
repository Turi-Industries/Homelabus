[package]
name = "hlb-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node agent: local state, disk, backups."

[[bin]]
name = "hlb-agent"
path = "src/main.rs"

[dependencies]
hlb-bootstrap.workspace = true
axum = "0.8"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# 🔴 `ring` explicitly, NOT the default provider: otherwise rustls 0.23 pulls in
# `aws-lc-sys`, a C library of several tens of MB that needs cmake to build. `ring` is
# already in the tree through reqwest.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "fs", "process", "net", "sync", "time", "macros", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net"] }

[lints]
workspace = true
