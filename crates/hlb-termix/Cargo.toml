[package]
name = "hlb-termix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Termix, given the cluster's nodes: its API, the nodes' key, and the account it reaches each node as."

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The nodes' key, generated in memory: never a file, never `ssh-keygen`.
ed25519-dalek = "3.0.0"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "process"] }
tempfile = "3"

[lints]
workspace = true
