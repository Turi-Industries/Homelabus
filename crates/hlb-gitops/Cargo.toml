[package]
name = "hlb-gitops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Git mirror of the desired state: history, diff and rollback."

[dependencies]
hlb-types.workspace = true
# `vendored-libgit2`: no system dependency to install, consistent with the principle
# "assume no binary is present on the host".
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
serde_yaml_ng.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
