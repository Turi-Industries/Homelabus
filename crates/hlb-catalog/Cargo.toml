[package]
name = "hlb-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Loading and validating the application catalog."

[dependencies]
hlb-types.workspace = true
hlb-api.workspace = true
hlb-resolver.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Holding a manifest to the schema of the oldest `hlb` its range accepts. No network:
# the schemas are carried, and a `$ref` outside them is an error, never a fetch.
jsonschema = { version = "0.60", default-features = false }
# A source's signed index. Signing and checking only — fetching it is not this crate's.
ed25519-dalek = "3.0.0"

[dev-dependencies]
hlb-backup.workspace = true
hlb-registry.workspace = true
hlb-updater.workspace = true
hlb-ingress.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[lints]
workspace = true
