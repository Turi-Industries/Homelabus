[package]
name = "hlb-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Daemon : API de lecture et boucles de fond."

[lib]
name = "hlb_controller"
path = "src/lib.rs"

[[bin]]
name = "hlb-controller"
path = "src/main.rs"

[dependencies]
hlb-types.workspace = true
serde_yaml_ng.workspace = true
hlb-api.workspace = true
hlb-state.workspace = true
hlb-engine.workspace = true
hlb-ingress.workspace = true
hlb-resolver.workspace = true
hlb-catalog.workspace = true
hlb-orchestrator.workspace = true
hlb-backup.workspace = true
hlb-secrets.workspace = true
hlb-gitops.workspace = true
hlb-agent.workspace = true
hlb-mail.workspace = true
hlb-identity.workspace = true
hlb-users.workspace = true
hlb-metrics.workspace = true
hlb-notify.workspace = true
futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hlb-updater.workspace = true
axum = "0.8"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
tower = "0.5"

[lints]
workspace = true
