apiVersion: hlb/v1
kind: App
metadata:
  name: n8n
  displayName: n8n
  category: automation
  homepage: https://n8n.io
spec:
  image: { repo: n8nio/n8n, tag: "1.123.72" }
  requires:
    - kind: database
      engine: postgres

    # 🔴 PAS de SSO natif : l'OIDC de n8n est réservé à l'édition entreprise.
    # La communautaire a ses propres comptes (le premier inscrit est
    # propriétaire). `proxy-only` pose donc un portail devant.
    #
    # ⚠️ Conséquence à connaître : le portail couvre AUSSI /webhook/*. Les
    # déclencheurs appelés depuis l'extérieur ne passeront pas. Tant que
    # l'ingress ne sait pas distinguer les chemins, c'est l'un ou l'autre — et
    # on choisit de protéger l'interface, qui détient les identifiants.
    - kind: sso
      mode: proxy-only

    # 🔴 À conserver MÊME avec PostgreSQL. Ce répertoire ne porte pas que la base
    # SQLite qu'on vient de remplacer : il contient la clé de chiffrement, les
    # journaux d'instance et les données du contrôle de source. n8n le dit
    # lui-même. Le supprimer en croyant que « tout est en base » perd la clé.
    - kind: storage
      name: data
      path: /home/node/.n8n
      tier: local
      backup: true

    # Les workflows envoient des mails (notification d'échec, rapports).
    - kind: smtp
  # 🔴 §4.3 — comment n8n reçoit ce que le résolveur a provisionné.
  #
  # Sans ce bloc, la base `n8n` était créée, son rôle isolé aussi, son mot de passe
  # déposé au coffre — et n8n démarrait sans rien savoir de tout ça, puis retombait
  # sur son SQLite interne. Service sain, sonde verte, et les données dans un fichier
  # que personne ne sauvegardait pendant qu'une base vide était dumpée chaque nuit.
  #
  # ⚠️ Les jetons de secret ne sont PAS résolus dans le plan : `hlb plan` affiche
  # « {{ db.password }} », et seule Swarm voit la valeur.
  env:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: "{{ db.host }}"
    DB_POSTGRESDB_PORT: "{{ db.port }}"
    DB_POSTGRESDB_DATABASE: "{{ db.name }}"
    DB_POSTGRESDB_USER: "{{ db.user }}"
    DB_POSTGRESDB_PASSWORD: "{{ db.password }}"

    # n8n construit ses URL de webhook à partir de là. Sans ces trois lignes il
    # annonce « localhost:5678 », que rien d'extérieur ne sait joindre.
    N8N_HOST: "{{ domain }}"
    N8N_PROTOCOL: https
    WEBHOOK_URL: "https://{{ domain }}/"

    # Le relais de la plateforme, pour les notifications d'échec de workflow.
    N8N_SMTP_HOST: "{{ smtp.host }}"
    N8N_SMTP_PORT: "{{ smtp.port }}"
    N8N_SMTP_USER: "{{ smtp.user }}"
    N8N_SMTP_PASS: "{{ smtp.password }}"
  ingress:
    - host: "{{ domain }}"
      port: 5678
      chain: [caddy-back]
      # 🔴 Privé. n8n stocke les identifiants de TOUS les services qu'il pilote :
      # clés d'API, jetons, mots de passe. C'est un coffre-fort qui s'ignore.
      expose: private
  security:
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID]
  swarm:
    replicas: 1
    tier: heavy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null || exit 1"]
  update:
    channel: minor
