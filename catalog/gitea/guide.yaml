# Steps the deployment alone does not cover.
steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      At your registrar, point {{ domain }} at the cluster.

      If a wildcard *.{{ base_domain }} already exists, there is nothing to do.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: pocketid-secret
    title: Give Gitea its PocketID sign-in secret
    phase: post-install
    severity: blocking
    body: |
      Gitea's command line takes a sign-in's secret as an argument only, which every
      account of the machine can read in `ps`. Homelabus writes it into Gitea's own
      database instead, then restarts Gitea, which reads its sign-in sources at its
      start. Nothing to do; if this step stays open, `hlb install gitea --apply`
      tries it again.
    automate:
      # Stored as is in `login_source.cfg` (1.27.3); `update-oauth` without `--secret`
      # keeps it at every start.
      - method: sql
        statement: "UPDATE login_source SET cfg = jsonb_set(cfg::jsonb, '{ClientSecret}', to_jsonb($1::text))::text WHERE name = 'PocketID'"
        params: ["{{ oidc.client_secret }}"]
        probe: "SELECT cfg::jsonb->>'ClientSecret' = $1 FROM login_source WHERE name = 'PocketID'"
        restart: true

  - id: create-admin
    title: Sign in first, to become the administrator
    phase: post-install
    severity: blocking
    after: [pocketid-secret]
    body: |
      The FIRST person to sign in through PocketID becomes Gitea's administrator;
      there is no local sign-up. Until that is done, the app stays reachable from
      the VPN only.
    deeplink: "https://{{ domain }}/user/login"
    # Attested: no page says whether an administrator exists without a sign-in
    # (REQUIRE_SIGNIN_VIEW), and `/api/healthz` said "done" before anyone signed in.
    verify:
      type: attest

  - id: git-over-ssh
    title: Open the SSH port if you want to clone over SSH
    phase: post-install
    severity: recommended
    body: |
      HTTPS cloning works with nothing to do. For SSH, forward the chosen port to
      the cluster.
