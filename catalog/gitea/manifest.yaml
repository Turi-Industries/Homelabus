apiVersion: hlb/v1
kind: App
metadata:
  name: gitea
  displayName: Gitea
  category: development
  homepage: https://about.gitea.com
spec:
  # 28 — Gitea's own renumbering of 1.28 — rehearsed on 2026-10-19 on a 1.27 database
  # through this start: its migrations, a private repository, a push reaching Gitea
  # through the hooks it wrote again, the PocketID source and its secret all kept.
  image: { repo: gitea/gitea, tag: "28.2", digest: "sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504" }
  requires:
    - kind: database
      engine: postgres
    - kind: sso
      mode: native
      redirectPaths: ["/user/oauth2/PocketID/callback"]
    - kind: storage
      name: data
      path: /data
      tier: local
      backup: true
    # Notifications, and the mail a person signing up confirms.
    - kind: smtp
  # Gitea receives its coordinates through GITEA__section__key variables.
  env:
    GITEA__database__DB_TYPE: postgres
    GITEA__database__HOST: "{{ db.host }}:{{ db.port }}"
    GITEA__database__NAME: "{{ db.name }}"
    GITEA__database__USER: "{{ db.user }}"
    GITEA__database__PASSWD: "{{ db.password }}"

    # Without ROOT_URL, Gitea builds its clone URLs from the container name.
    GITEA__server__ROOT_URL: "https://{{ domain }}/"
    GITEA__server__DOMAIN: "{{ domain }}"

    # It had no [mailer] at all. `gitea admin sendmail` reached a Stalwart mailbox on
    # 2026-10-18 — ⚠️ the command says "Sent" before the mail leaves: a refused
    # certificate shows in Gitea's log only.
    GITEA__mailer__ENABLED: "true"
    GITEA__mailer__PROTOCOL: smtp+starttls
    GITEA__mailer__SMTP_ADDR: "{{ smtp.host }}"
    GITEA__mailer__SMTP_PORT: "{{ smtp.port }}"
    GITEA__mailer__USER: "{{ smtp.user }}"
    GITEA__mailer__PASSWD: "{{ smtp.password }}"
    GITEA__mailer__FROM: "Gitea <{{ smtp.from }}>"

    # Configured by the variables above, so no installer: left unlocked, Gitea serves
    # one at every address, and its command line refuses an uninstalled instance — the
    # sign-in below was never written.
    GITEA__security__INSTALL_LOCK: "true"
    # The keys that encrypt and sign what Gitea keeps — second factors, the PocketID
    # sign-in's secret, Actions secrets —, from the vault. Left empty, as the image
    # leaves it, Gitea 1.27.3 encrypts with a constant written in its source
    # (`!#@FDEWREWR&*(`, `modules/setting/security.go`). Held here and not in app.ini,
    # they let the start below rebuild app.ini from nothing.
    GITEA__security__SECRET_KEY: "{{ secret.secret-key }}"
    GITEA__security__INTERNAL_TOKEN: "{{ secret.internal-token }}"
    GITEA__oauth2__JWT_SECRET: "{{ secret.jwt-secret:base64url }}"
    GITEA__server__LFS_JWT_SECRET: "{{ secret.lfs-jwt-secret:base64url }}"
    # Accounts come through PocketID, whose people were invited: no local sign-up, and
    # the first person to sign in becomes the administrator. Closing sign-ups with
    # DISABLE_REGISTRATION would close PocketID's too.
    GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
    GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
    # PocketID sends no `nickname`, Gitea's default source for the name; its username
    # is `preferred_username`. It was `email`, an address as a login and in every URL
    # — accounts made then keep their name.
    GITEA__oauth2_client__USERNAME: preferred_username
    # A PocketID sign-in matching an existing account joins it instead of asking for a
    # local password that account — made through PocketID too — never had.
    GITEA__oauth2_client__ACCOUNT_LINKING: auto
    # OpenID 2.0 is a second way in, unrelated to PocketID.
    GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
    GITEA__openid__ENABLE_OPENID_SIGNUP: "false"

    # Nothing is read without signing in — the explore page, the API, a repository's
    # files — and what is created is private unless someone says otherwise. ⚠️ It
    # closes `/api/v1/version` too: the guide checks `/api/healthz`.
    GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
    GITEA__repository__DEFAULT_PRIVATE: private
    # Seen by whoever is signed in, not only by themselves: a household adds its
    # members to a repository by name.
    GITEA__service__DEFAULT_USER_VISIBILITY: limited
    GITEA__service__DEFAULT_ORG_VISIBILITY: limited
    # No CDN, no Gravatar: a page view tells nobody outside who looked at it.
    GITEA__server__OFFLINE_MODE: "true"

    # Read by the start below — Gitea itself ignores them.
    HLB_OIDC_ISSUER: "{{ oidc.issuer }}"
    HLB_OIDC_CLIENT_ID: "{{ oidc.client_id }}"
  # 🔴 `sso: native` created the client in PocketID; this is what tells Gitea. Its
  # sign-in sources live in its database and only its command line writes them — and
  # one written while `gitea web` runs is not seen until it restarts. So they are
  # written before it starts, at every deployment: a new secret reaches it with the
  # next one. The name gives the callback's segment: `/user/oauth2/PocketID/callback`.
  # PocketID not answering does not stop Gitea: it starts without the sign-in, and says
  # so in its log. Checked against gitea/gitea:1.24.7.
  #
  # 🔴 Its command line takes the client secret as `--secret` only — no file, no
  # variable, and no API writes a sign-in source — and an argument is readable in
  # `ps` by every account of the node. It is never passed: the source is written
  # without it, and the guide's `sql` step puts it in Gitea's database (stored as
  # is, 1.27.3), which `update-oauth` without `--secret` keeps.
  #
  # 🔴 Nothing in the volume decides what Gitea runs or serves. A restored volume is
  # whatever the backup holds, and after an intrusion the backup is the intruder's:
  # app.ini runs commands (`[markup.*] RENDER_COMMAND`) and opens accounts
  # (`ENABLE_REVERSE_PROXY_AUTHENTICATION`); `custom/` is served on every page; a
  # repository's `hooks/<name>.d/` runs at every push, beside Gitea's own hook, and
  # its config can point git at hooks elsewhere (`core.hooksPath`, or `commondir`).
  # So at every start, before Gitea: app.ini is rebuilt from the image's template and
  # this environment, `custom/` and git's global config are removed, each
  # repository's hooks are removed and its config kept to the keys git and Gitea
  # write (1.27.3), and what was not Gitea's is said in the log. Then Gitea writes
  # its hooks and SSH keys again, from its database.
  command: [/usr/bin/entrypoint, bash, /run/hlb/gitea-start.sh]
  files:
    # A comment without a logo. A logo set later reaches Gitea with `hlb redeploy gitea`.
    - path: /run/hlb/logo.svg
      content: "{{ brand.logo }}"
    - path: /run/hlb/gitea-start.sh
      content: |
        said() { echo "hlb: removed from the volume, not Gitea's: $*" >&2; }
        rm -f /data/gitea/conf/app.ini /data/gitea/home/.gitconfig /data/git/.ssh/authorized_keys
        for d in templates public options; do
          [ -e "/data/gitea/$d" ] || [ -L "/data/gitea/$d" ] || continue
          said "custom/$d"; rm -rf "/data/gitea/$d"
        done
        # The household's logo, from Homelabus — never from the volume.
        if grep -q '<svg' /run/hlb/logo.svg 2>/dev/null; then
          install -d -o git -g git /data/gitea/public/assets/img
          for f in logo.svg favicon.svg; do
            install -o git -g git -m 0644 /run/hlb/logo.svg "/data/gitea/public/assets/img/$f"
          done
        fi
        allow='^(core\.(repositoryformatversion|filemode|bare|logallrefupdates|ignorecase|precomposeunicode|symlinks|commitgraph|sharedrepository)|extensions\.(objectformat|refstorage)|receive\.(advertisepushoptions|procreceiverefs)|remote\..+\.(url|fetch|mirror|tagopt|prune)|gc\.[a-z]+|fetch\.writecommitgraph)$'
        # An owner or a repository that is a link was never written by Gitea, and
        # following it would skip what is checked below.
        while IFS= read -r l; do said "$l (a link)"; rm -f "$l"; done \
          < <(find /data/git/repositories -mindepth 1 -maxdepth 2 -type l 2>/dev/null)
        shopt -s nullglob
        for r in /data/git/repositories/*/*.git; do
          for f in commondir config.worktree gitdir worktrees; do
            [ -e "$r/$f" ] || [ -L "$r/$f" ] || continue
            said "$r/$f"; rm -rf "${r:?}/$f"
          done
          foreign=$(cd "$r" && find hooks -mindepth 1 2>/dev/null \
            | grep -vxE 'hooks/(pre-receive|update|post-receive|proc-receive)(\.d|\.d/gitea)?|hooks/[a-z-]+\.sample' || true)
          [ -z "$foreign" ] || said "$r: $(echo $foreign)"
          rm -rf "$r/hooks"
          cfg="$r/config" kept="$r/config.hlb" dropped=""
          rm -f "$kept"
          if [ -f "$cfg" ] && [ ! -L "$cfg" ] && git config --file "$cfg" --list >/dev/null 2>&1; then
            while IFS= read -r -d '' e; do
              k=${e%%$'\n'*}
              if [ "$k" = "$e" ]; then v=true; else v=${e#*$'\n'}; fi
              if [[ "${k,,}" =~ $allow ]]; then git config --file "$kept" --add "$k" "$v"; else dropped="$dropped $k"; fi
            done < <(git config --file "$cfg" --list -z)
            [ -z "$dropped" ] || said "$r/config:$dropped"
          else
            said "$r/config (unreadable)"
          fi
          [ -s "$kept" ] || printf '[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n\tbare = true\n' > "$kept"
          mv -f "$kept" "$cfg" && chown git:git "$cfg"
        done
        shopt -u nullglob
        cd /etc/s6/gitea && source ./setup
        cd /app/gitea
        gitea() { su-exec git /usr/local/bin/gitea "$@"; }
        oidc=(--provider openidConnect --key "$HLB_OIDC_CLIENT_ID"
              --auto-discover-url "$HLB_OIDC_ISSUER/.well-known/openid-configuration"
              --scopes openid --scopes email --scopes profile
              --group-claim-name hlb_gitea --admin-group admin
              --required-claim-name hlb_gitea)
        # Left by the start that once passed `--secret`.
        rm -f /data/gitea/hlb-oidc-secret.sha256
        if gitea migrate >/dev/null; then
          id=$(gitea admin auth list | awk 'NR > 1 && $2 == "PocketID" { print $1 }')
          if [ -n "$id" ]; then
            gitea admin auth update-oauth --id "$id" "${oidc[@]}"
          else
            gitea admin auth add-oauth --name PocketID "${oidc[@]}"
          fi
        fi || echo "hlb: the PocketID sign-in is not configured; Gitea starts without it" >&2
        # Without its hooks a push lands and Gitea never hears of it.
        gitea admin regenerate hooks >/dev/null \
          || echo "hlb: the repositories' hooks were not written; a push will not reach Gitea" >&2
        gitea admin regenerate keys >/dev/null || true
        exec /usr/bin/s6-svscan /etc/s6
  # Who enters is the roles': PocketID lets in only the groups of the roles allowed,
  # and Gitea refuses whoever comes without `hlb_gitea` — which only those groups carry
  # — even were that restriction lifted by hand. The claim also says who administers
  # Gitea, read at every sign-in: a role losing its level loses Gitea's admin flag at
  # its next one. Gitea takes ONE admin group and ONE required value, exact
  # (`routers/web/auth/oauth.go`, 1.24.7), hence a claim of its own rather than the
  # roles' groups. Its team map is not used: it maps onto organisations and teams that
  # must already exist, and skips the rest with a warning in its log.
  access:
    admins:
      level: admin
      means: every repository, organisation and account in Gitea
    claims:
      hlb_gitea: { byLevel: { user: user, admin: admin } }
  ingress:
    - host: "{{ domain }}"
      port: 3000
      # No Anubis: a proof-of-work in front of the Git endpoint would break `git clone`.
      chain: [caddy-front, caddy-back]
      expose: after-guide      # The first to sign in is the administrator
      # Gitea 1.27 answers a wrong password, and a wrong code, with the form again — a
      # 200 —, so only the limit bounds them. A second factor is its own route: a
      # sign-in passes through both. Basic authentication on the API carries a
      # password too, by a header no path can name.
      authRoutes:
        - paths: [/user/login, /user/login/*, /user/forgot_password]
        - paths: [/user/two_factor, /user/two_factor/*, /user/webauthn, /user/webauthn/*]
  security:
    # These apps write into their rootfs at startup (configuration, cache) and drop
    # their privileges to a non-root user.
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
  swarm:
    memory: { reserve: 192M, limit: 1G }
    replicas: 1
    tier: heavy
  update:
    channel: minor
  # Read from Gitea itself, anonymously — what a visitor from the internet meets.
  assertions:
    - id: signups-closed
      holds: nobody creates a Gitea account except through PocketID
      check:
        type: http
        path: /user/sign_up
        contains: Registration is disabled
    - id: signin-to-read
      holds: nothing in Gitea is read without signing in
      check: { type: http, path: /api/v1/repos/search, status: [401, 403] }
    - id: openid-off
      holds: no OpenID 2.0 sign-in beside PocketID
      check: { type: http, path: /user/login/openid, status: [403, 404] }
    - id: no-local-password
      holds: no Gitea account signs in with a password of its own
      check:
        type: sql
        # `login_type` 0 and 1 are Gitea's own passwords; PocketID's accounts are 6.
        query: SELECT count(*) FROM "user" WHERE type = 0 AND login_type IN (0, 1)
        equals: "0"
