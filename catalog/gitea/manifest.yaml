apiVersion: hlb/v1
kind: App
metadata:
  name: gitea
  displayName: Gitea
  category: development
  homepage: https://about.gitea.com
spec:
  image: { repo: gitea/gitea, tag: "1.24" }
  requires:
    - kind: database
      engine: postgres
    - kind: sso
      mode: native
      redirectPaths: ["/user/oauth2/PocketID/callback"]
    - kind: storage
      name: data
      path: /data
      tier: local
      backup: true
  # §4.3 — Gitea reçoit ses coordonnées par des variables GITEA__section__clé.
  env:
    GITEA__database__DB_TYPE: postgres
    GITEA__database__HOST: "{{ db.host }}:{{ db.port }}"
    GITEA__database__NAME: "{{ db.name }}"
    GITEA__database__USER: "{{ db.user }}"
    GITEA__database__PASSWD: "{{ db.password }}"

    # Sans ROOT_URL, Gitea fabrique ses URL de clone à partir du nom de conteneur.
    GITEA__server__ROOT_URL: "https://{{ domain }}/"
    GITEA__server__DOMAIN: "{{ domain }}"
  ingress:
    - host: "{{ domain }}"
      port: 3000
      # Pas d'Anubis : un proof-of-work devant l'endpoint Git casserait `git clone`.
      chain: [caddy-front, caddy-back]
      expose: after-guide      # §4.6bis — premier inscrit = admin
  security:
    # Ces apps écrivent dans leur rootfs au démarrage (configuration, cache) et
    # abandonnent leurs privilèges vers un utilisateur non root.
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
  swarm:
    replicas: 1
    tier: heavy
  update:
    channel: minor
