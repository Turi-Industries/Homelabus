apiVersion: hlb/v1
kind: App
metadata:
  name: bulwark
  displayName: Bulwark
  category: mail
  homepage: https://bulwarkmail.org
spec:
  # 🔴 The project's own image. The catalog named `ghcr.io/daemonless/bulwark-webmail`
  # until 2026-10-11 — a third-party repackaging built for FREEBSD: no Linux node can
  # run it, and nothing short of a pull showed it. `pin`: a young project, updated by
  # hand after reading its notes.
  image: { repo: ghcr.io/bulwarkmail/webmail, tag: "1.14.2", digest: "sha256:9885a046afab5054719004b885bd821d164f0d4e50a21100b96595b0400e0403" }
  requires:
    # No database: Bulwark is a JMAP client. Everything — messages, folders, filters,
    # contacts — lives at Stalwart; what it keeps is its own administration, below.
    #
    # 🔴 NO `sso` capability: authentication happens against Stalwart over JMAP, with
    # the mailbox's credentials. Declaring an OIDC client would create a client nobody
    # would use, and would suggest a protection that does not exist — the same mistake
    # as Jellyfin.
    - kind: sso
      mode: none
    # Its administration settings and their audit log — the mail itself stays at
    # Stalwart.
    - kind: storage
      name: admin
      path: /app/data/admin
      tier: local
      backup: true
    - kind: storage
      name: admin-state
      path: /app/data/admin-state
      tier: local
      backup: true
  env:
    # ⚠️ Stalwart's PUBLIC URL, not its internal service name: it is the BROWSER that
    # speaks JMAP, not the container. Putting "stalwart:8080" here would give a page
    # that loads and never connects, with no readable error.
    JMAP_SERVER_URL: "https://mail.{{ domain }}"
    TZ: "{{ timezone }}"
    # Signs its sessions; generated at install, kept in the vault.
    SESSION_SECRET: "{{ secret.session-secret }}"
    # Its own administration page (branding, policy). Without it, the first visitor
    # to reach the setup page sets it.
    ADMIN_PASSWORD: "{{ secret.admin-password }}"
    BULWARK_TELEMETRY: "off"
    # Next.js binds to $HOSTNAME, which Docker sets to the container's name: the probe
    # on localhost, and Caddy through the overlay alias, would meet a closed port.
    HOSTNAME: "0.0.0.0"
  ingress:
    - host: "{{ domain }}"
      port: 3000
      # No Anubis: the client makes long JMAP requests in the background and a
      # proof-of-work would break them.
      chain: [caddy-front, caddy-back]
      # 🔴 Private as long as the project is not mature. A public webmail is a sign-in
      # page facing the internet, and this one comes from a one-star project.
      expose: private
  security:
    # Next.js writes its cache beside the app. It runs as its own user and needs no
    # capability.
    readOnlyRootfs: false
  swarm:
    memory: { reserve: 128M, limit: 512M }
    # Stateless: several replicas would be possible. One is plenty for domestic use,
    # and avoids paying for memory for nothing.
    replicas: 1
    tier: light
    healthcheck:
      # 127.0.0.1, not localhost: the image resolves localhost to ::1 first, where
      # nothing listens.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
  update:
    channel: pin
  # Its administration page, which asks for the password alone.
  recovery:
    - secret: admin-password
      # 401 to a refusal; 429 past its rate, which locks nothing (1.14.2).
      proof:
        path: /api/admin/auth
        body: '{"password":"{{ password }}"}'
        pointer: /ok
