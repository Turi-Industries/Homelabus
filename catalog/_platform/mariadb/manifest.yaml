apiVersion: hlb/v1
kind: PlatformService
metadata:
  name: mariadb
  displayName: MariaDB
  category: platform
  homepage: https://mariadb.org
spec:
  # `11.8.x` and not `lts`: an "lts" tag changes MAJOR version the day the next LTS
  # comes out. A major database migration must never arrive by surprise during a
  # nightly maintenance window.
  image: { repo: mariadb, tag: "12.3.2", digest: "sha256:a02fe89cb597d4375812b2eac90cf9d0775d4686daa7f7cc750ebbcad7525bbc" }
  # 🔴 Swarm's virtual IP forgets a connection idle for 900 s and tells neither end:
  # the server's keepalives cross it for every client, as PostgreSQL's do. 0 — the
  # image's default — is the system's 7200. After the image's own entrypoint, its
  # `Cmd` first.
  args:
    - mariadbd
    - --tcp-keepalive-time=300
    - --tcp-keepalive-interval=30
    - --tcp-keepalive-probes=3
    # Shared by every app: the catalog sums their `connections` against it.
    - --max-connections=250
  requires:
    # Never on NFS, the same reason as PostgreSQL: file locking is not
    # reliable there, and InnoDB depends on it.
    #
    # 🔴 Copied by `mariadb-backup` while the server runs, then prepared — never by
    # restic reading the directory: that takes each file at another instant.
    - kind: storage
      name: data
      path: /var/lib/mysql
      tier: local
      backup: true
      copy: mariadb-backup
  security:
    # The entrypoint adjusts the data directory's permissions then drops its
    # privileges to the mysql user.
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
  swarm:
    memory: { reserve: 256M, limit: 1G }
    replicas: 1
    # Pinned to the "heavy" node: local volumes do not follow containers
    # rescheduled by Swarm.
    tier: heavy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
  update:
    # Minor only: a major imposes an internal schema migration that an image
    # rollback cannot reverse.
    channel: minor
  env:
    # 🔴 The image refuses to initialise without a root password or an explicit
    # "allow empty". Generated at install, kept in the vault.
    MARIADB_ROOT_PASSWORD_FILE: /run/secrets/root-password
    # 🔴 Without it a new major starts healthy on its predecessor's data and skips
    # `mariadb-upgrade`: the system tables stay the old version's, and nothing says so.
    MARIADB_AUTO_UPGRADE: "1"
  files:
    - path: /run/secrets/root-password
      content: "{{ secret.root-password }}"
