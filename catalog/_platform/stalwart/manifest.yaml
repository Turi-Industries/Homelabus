apiVersion: hlb/v1
kind: PlatformService
metadata:
  name: stalwart
  displayName: Stalwart Mail
  category: platform
  homepage: https://stalw.art
spec:
  # 🔴 A 1.0 server refuses to open a 0.16 store: an installed 0.16 moves only through
  # `hlb mail migrate`, which copies its store into the new volume below. `hlb-mail`
  # speaks both, for as long as a 0.16 is installed somewhere.
  image: { repo: stalwartlabs/stalwart, tag: "v1.0.0", digest: "sha256:baafeacd6cbde77acdd94af49972d41c6709e54a376df48e18a9fe3f445eb3d5", signedBy: { github: stalwartlabs/stalwart, workflow: ci.yml } }
  requires:
    # The image's own data directory: it belongs to the `stalwart` user, and a new
    # volume inherits that. `/opt/stalwart` belonged to root, and RocksDB could not
    # open its log there. `data-v1`, not `data`: the 0.16 store keeps its own volume,
    # untouched, so rolling a migration back is starting 0.16 on it again.
    - kind: storage
      name: data-v1
      path: /var/lib/stalwart
      tier: local        # 🔴 never NFS: RocksDB + blobs
      backup: true
      # RocksDB copied live does not open: restic reads its SSTs, then the
      # MANIFEST naming one flushed in between.
      copy: stopped
  ingress:
    # Only the web interface goes through the proxy. The mail ports are published on
    # the node itself, below: SMTP and IMAP are not HTTP, and a proof-of-work in front
    # of SMTP would break reception.
    - host: "{{ domain }}"
      port: 8080
      chain: [caddy-front, caddy-back]
      expose: public
  security:
    # The binary carries a file capability to bind port 25: with every capability
    # dropped, the kernel refuses to even execute it ("operation not permitted").
    capAdd: [NET_BIND_SERVICE]
    # SMTP, SMTPS, IMAPS, ManageSieve — in host mode, so the sender's address reaches
    # the spam checks. Submission (587), which Stalwart's defaults do not open, is
    # opened with the first app's sending account, and reached on the overlay only:
    # people's own clients have 465.
    publishedPorts: [25, 465, 993, 4190]
  swarm:
    memory: { reserve: 192M, limit: 1G }
    # One instance: its RocksDB lives on one node's volume.
    replicas: 1
    tier: heavy
  update:
    # A mail server does not update itself on its own at night.
    channel: pin
  companions:
    # 🔴 Its own recursive resolver. Stalwart's spam filter asks blocklists — Spamhaus,
    # URIBL, DNSWL — which refuse a public resolver, and the node's is one in most
    # houses: they answer a refusal, scored zero, and every spammer's message passes.
    # Unbound recurses from the root itself (no forwarder in this image's config), asked
    # by nobody else; Stalwart is pointed at it by Homelabus (`submission::own_resolver`).
    - name: resolver
      image: { repo: klutchell/unbound, tag: "1.26.2", digest: "sha256:50cbeb32b5838a829a7226b19cb151f9535bd7f9f3190f950780f452fe807478" }
      tier: light
      memory: { reserve: 32M, limit: 256M }
      security:
        # It rewrites its DNSSEC trust anchor (`root.key`) beside its config.
        readOnlyRootfs: false
        # Port 53, and the switch from root to its `unbound` user.
        capAdd: [NET_BIND_SERVICE, SETUID, SETGID]
      healthcheck:
        # Answered from its own zones: a house whose internet is down keeps a healthy
        # resolver, and Stalwart deployable.
        test: ["CMD", "drill", "@127.0.0.1", "localhost"]
  # 🔴 Without a configuration Stalwart boots into a setup page that whoever reaches
  # first configures. With the file below it boots its services, and
  # `STALWART_RECOVERY_ADMIN` pins the administrator — generated at install, read back
  # from the vault by `hlb` and the controller to provision mailboxes. Stalwart reads
  # it from its environment only (1.0.0), so it is set here from its file, for the
  # process alone: the service's own environment never holds it. Then the image's
  # `Entrypoint` and `Cmd`, as they are.
  command:
    - /bin/sh
    - -c
    - STALWART_RECOVERY_ADMIN="admin:$(cat /run/secrets/admin-password)" exec /usr/local/bin/stalwart --config /etc/stalwart/config.json
  files:
    - path: /run/secrets/admin-password
      content: "{{ secret.admin-password }}"
    # Stalwart reads only this: where its database lives. Everything else — domains,
    # accounts, listeners — is in that database and set over JMAP. Checked against
    # 0.16.26 and 1.0.0: with it, SMTP, SMTPS, IMAPS and ManageSieve listen from the
    # first start.
    - path: /etc/stalwart/config.json
      content: '{"@type":"RocksDb","path":"/var/lib/stalwart/"}'
  # Its recovery administrator: the mail server's way in when PocketID is down.
  recovery:
    - secret: admin-password
      username: admin
      # An empty JMAP request: 401 to a refusal (0.16.26, 1.0.0). Its auto-ban counts
      # failures by address, which a refusal never tried again keeps far from.
      proof:
        path: /jmap/
        body: '{"using":["urn:ietf:params:jmap:core"],"methodCalls":[]}'
        basic: true
        pointer: /sessionState
