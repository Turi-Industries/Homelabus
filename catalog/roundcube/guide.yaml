steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      Point {{ domain }} at the cluster. A wildcard is enough.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: managesieve
    title: Enable ManageSieve on the Stalwart side
    phase: pre-install
    severity: blocking
    body: |
      Roundcube's `managesieve` plugin talks to Stalwart's port 4190. Without that
      service active, the "Filters" tab shows up and stays EMPTY — the error is on
      the server side and Roundcube does not surface it clearly.

      It is also through this path that you will re-read and fix the sorting rules
      Homelabus generates for your aliases.

  - id: why-no-sso
    title: Why Roundcube is NOT behind the SSO
    phase: post-install
    severity: tip
    body: |
      That is deliberate, and it is its whole reason for being here.

      Roundcube authenticates directly over IMAP against Stalwart. The day PocketID
      goes down — or Bulwark breaks on an update — it stays the path that still
      works for reading your mail.

      A safety net that depends on what it is meant to catch is not a safety net.


      An acknowledged trade-off: its sign-in form is protected only by the
      mailbox's password. Hence the PRIVATE exposure — it stays reachable from the
      VPN, which is enough for troubleshooting.
