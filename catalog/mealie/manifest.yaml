apiVersion: hlb/v1
kind: App
metadata:
  name: mealie
  displayName: Mealie
  category: home
  homepage: https://mealie.io
spec:
  image: { repo: ghcr.io/mealie-recipes/mealie, tag: v3.29.0, digest: "sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc" }
  requires:
    - kind: database
      engine: postgres
      # Not a setting: SQLAlchemy's 5 + 10 overflow, per Uvicorn worker — one, below
      # (v3.29.0 `db/db_setup.py`).
      connections: 15
    # `/login` is where Mealie sends PocketID's answer: `BASE_URL` + `/login`
    # (`routes/auth/auth.py`, v3.29.0).
    - kind: sso
      mode: native
      redirectPaths: ["/login"]
    - kind: storage
      name: data
      path: /app/data
      tier: local
      backup: true
    - kind: smtp
  # Every variable below is read by `core/settings/settings.py` or `docker/entry.sh`
  # (v3.29.0); the entry script turns each `*_FILE` it names into its variable.
  env:
    UVICORN_WORKERS: "1"
    # Without it, invitation links and the sign-in callback point at localhost.
    BASE_URL: "https://{{ domain }}"
    # 🔴 Root in its container, with no capability: started as 911 it cannot write the
    # volume Docker made root's ("Permission denied: '/app/data/groups'", measured
    # 2026-10-30), and started as root it `chown`s and `gosu`s, which no capability
    # allows. `PUID=0` takes the entry script's "already that user" branch.
    PUID: "0"
    PGID: "0"
    # Its root is read-only: Python's `tempfile` — every import from another app, a
    # backup restored, an upload over 1 MB — writes beside Mealie's own `.temp` instead
    # of `/tmp`. Not a tmpfs, which would count an import's photos against the memory
    # limit; not `.temp` itself, which Mealie makes only on demand.
    TMPDIR: /app/data

    DB_ENGINE: postgres
    POSTGRES_SERVER: "{{ db.host }}"
    POSTGRES_PORT: "{{ db.port }}"
    POSTGRES_DB: "{{ db.name }}"
    POSTGRES_USER: "{{ db.user }}"
    POSTGRES_PASSWORD_FILE: /run/secrets/db-password

    # People come through PocketID, which makes their account at the first sign-in.
    ALLOW_SIGNUP: "false"
    # ⚠️ `ALLOW_PASSWORD_LOGIN` is left on, deliberately: the token endpoint never reads
    # it (`credentials_provider.py`) — set false, the seeded administrator still got a
    # token by password (measured 2026-10-30) — and it would hide the form a person
    # needs the day PocketID is down. The guide gives that account the vault's password.
    OIDC_AUTH_ENABLED: "true"
    OIDC_CONFIGURATION_URL: "{{ oidc.issuer }}/.well-known/openid-configuration"
    OIDC_CLIENT_ID: "{{ oidc.client_id }}"
    OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc-secret
    OIDC_PROVIDER_NAME: PocketID
    # 🔴 Mealie asks for its groups claim as a SCOPE of the same name unless told the
    # scopes; PocketID gives custom claims with `profile`.
    OIDC_SCOPES_OVERRIDE: openid email profile
    # Its administrators from a claim of its own, re-read at every sign-in. ⚠️ Compared
    # with `in`: on a string claim that is a substring test, so no other level's value
    # may contain "admin".
    OIDC_GROUPS_CLAIM: hlb_mealie
    OIDC_ADMIN_GROUP: admin

    # Invitations and password resets, over STARTTLS on the submission port ("TLS" is
    # STARTTLS to Mealie; "SSL" would speak TLS first).
    SMTP_HOST: "{{ smtp.host }}"
    SMTP_PORT: "{{ smtp.port }}"
    SMTP_USER: "{{ smtp.user }}"
    SMTP_PASSWORD_FILE: /run/secrets/smtp-password
    SMTP_FROM_EMAIL: "{{ smtp.from }}"
    SMTP_AUTH_STRATEGY: TLS
  files:
    # 🔴 A variable beside its `_FILE` would win over it: each secret is the file alone.
    - path: /run/secrets/db-password
      content: "{{ db.password }}"
    - path: /run/secrets/oidc-secret
      content: "{{ oidc.client_secret }}"
    - path: /run/secrets/smtp-password
      content: "{{ smtp.password }}"
    # 🔴 Mealie signs its sessions with the two keys it reads from these files of its
    # data volume, drawing them at the first start (`determine_secrets`): no variable
    # sets them, and a volume restored from an intruder's backup would bring theirs.
    # Mounted over them, read only, they are the vault's — the file is kept and signs
    # the tokens (an HS256 token checked against it, 2026-10-30), and a backup of the
    # volume never holds them.
    - path: /app/data/.secret
      content: "{{ secret.jwt-secret }}"
    - path: /app/data/.session_secret
      content: "{{ secret.session-secret }}"
  access:
    admins:
      level: admin
      means: Mealie's administration — its users, groups, households and backups
    claims:
      hlb_mealie: { byLevel: { user: member, viewer: member, operator: member, admin: admin } }
  ingress:
    - host: "{{ domain }}"
      port: 9000
      chain: [caddy-front, caddy-back]
      # Private until the guide has replaced the seeded administrator's password.
      expose: after-guide
      authRoutes:
        - paths: [/api/auth/token]
          failsWith: 401
  security:
    user: "0:0"
  swarm:
    # 223 MiB once started on PostgreSQL (v3.29.0, 2026-10-30).
    memory: { reserve: 256M, limit: 768M }
    # One: its data sits on a local volume, which exists once per node.
    replicas: 1
    tier: light
  update:
    channel: minor
  # Read from `/api/app/about`, what Mealie's own sign-in page reads.
  assertions:
    - id: signups-closed
      holds: nobody creates a Mealie account from its sign-up form
      check:
        type: http
        path: /api/app/about
        pointer: /allowSignup
        equals: false
    - id: sign-in-through-pocketid
      holds: people sign in to Mealie through PocketID
      check:
        type: http
        path: /api/app/about
        pointer: /enableOidc
        equals: true
    # 🔴 Seeded at the first start, `admin` / `MyPassword`, whatever the environment
    # says (`_DEFAULT_PASSWORD` is private, read by no variable).
    - id: no-default-administrator
      holds: Mealie's seeded administrator no longer signs in with its published password
      check:
        type: sql
        query: "SELECT count(*) FROM users WHERE email = 'changeme@example.com'"
        equals: "0"
  # The seeded administrator, its password the vault's, for when PocketID signs nobody in.
  recovery:
    - secret: admin-password
      username: admin
      path: /login
      # A password grant: JSON is read as empty fields and refused, 401 (v3.29.0).
      proof:
        path: /api/auth/token
        body: '{"username":"{{ username }}","password":"{{ password }}"}'
        form: true
        pointer: /access_token
