# What the deployment alone does not cover.
steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      At your registrar, point {{ domain }} at the cluster.

      If a wildcard *.{{ base_domain }} already exists, there is nothing to do.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: replace-default-administrator
    title: Give Mealie's seeded administrator the vault's password
    phase: post-install
    severity: blocking
    body: |
      Mealie creates an administrator at its first start, `admin` / `MyPassword`, the
      same on every installation. Homelabus gives it a password from the vault and an
      address no PocketID account carries, then keeps it for the day PocketID signs
      nobody in. Nothing to do; if this step stays open, `hlb install mealie --apply`
      tries it again.
    automate:
      # 🔴 An OIDC sign-in ADOPTS a local account carrying its email
      # (`openid_provider.py`): `.invalid` (RFC 2606) is an address nobody receives.
      # bcrypt is what Mealie checks (`BcryptHasher`); the form's salt is derived from
      # the password, so the probe compares it as written.
      - method: sql
        statement: "UPDATE users SET password = $1, email = 'recovery@homelabus.invalid' WHERE username = 'admin' AND auth_method = 'MEALIE'"
        params: ["{{ secret.admin-password:bcrypt }}"]
        probe: "SELECT password = $1 AND email = 'recovery@homelabus.invalid' FROM users WHERE username = 'admin'"
