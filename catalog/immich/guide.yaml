# What the deployment alone does not cover.
steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      At your registrar, point {{ domain }} at the cluster.

      If a wildcard *.{{ base_domain }} already exists, there is nothing to do.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: postgres-vector
    title: 🔴 PostgreSQL must carry the vector extensions
    phase: pre-install
    severity: blocking
    body: |
      Immich needs the `vector` and `vchord` extensions. An extension is NOT
      installed from SQL: it must be present in the server's IMAGE.

      The catalog's `postgres` service therefore uses
      ghcr.io/immich-app/postgres:17-vectorchord…, the same major version as the
      previous image.

      ⚠️ If your PostgreSQL was already running on `postgres:17-alpine`, READ the
      "reindex-collation" step before switching: changing the C library changes
      the sort order of text, and the existing indexes become wrong WITHOUT
      anything signalling it.

      On a fresh installation, there is nothing to do.

  - id: reindex-collation
    title: 🔴 Reindex after a PostgreSQL image change
    phase: pre-install
    severity: blocking
    after: [postgres-vector]
    body: |
      Concerns ONLY installations that already had data on
      `postgres:17-alpine` (musl) and are moving to the Debian image (glibc).

      The two libraries do not sort text in the same order. B-tree indexes built
      under one become incoherent under the other: searches return incomplete
      results, unique constraints let duplicates through — and PostgreSQL only
      signals it with a collation version warning, easy to miss.

      After the switch, on EVERY database:

        REINDEX DATABASE database_name;
        ALTER DATABASE database_name REFRESH COLLATION VERSION;

      Take a backup first. `hlb backup run --force` handles that.

  - id: nfs-photos
    title: Check the photos' NFS share
    phase: pre-install
    severity: blocking
    body: |
      The `immich-data` volume must point at the NAS's NFS share.

      ⚠️ Without it, Immich starts and accepts uploads — into the container's
      ephemeral layer. Everything disappears on the first redeployment, and
      nothing warns you. It is the only volume in the catalog that is both
      irreplaceable and unbounded in size.

  - id: first-account
    title: Create the administrator account
    phase: post-install
    severity: blocking
    body: |
      The FIRST account to register becomes the administrator. Until that is
      done, Immich stays reachable from the VPN only.
    deeplink: "https://{{ domain }}/auth/register"
    verify:
      type: http
      # True once an administrator exists (`ServerConfigDto`, 3.3.1). `/api/server/ping`
      # answered as soon as Immich ran, and opened the route before anyone registered.
      # ⚠️ It is `!(IMMICH_ALLOW_SETUP && no admin)`: setting that variable to false
      # would read as initialized with nobody registered.
      url: "https://{{ domain }}/api/server/config"
      expectJson: { pointer: /isInitialized, equals: "true" }

  - id: check-ml
    title: Check that recognition really works
    phase: post-install
    severity: required
    after: [first-account]
    body: |
      🔴 Immich works perfectly without its machine-learning service: it
      imports, displays and backs up the photos. It simply never recognises
      anyone, and nothing on screen says that half the feature is missing.

      Upload a photo containing a face, then go to
      Administration → Jobs. The "Face recognition" row must advance.

      If it stays at zero, the companion is not answering:
        hlb ps | grep immich-machine-learning
