apiVersion: hlb/v1
kind: App
metadata:
  name: immich
  displayName: Immich
  category: media
  homepage: https://immich.app
spec:
  image: { repo: ghcr.io/immich-app/immich-server, tag: "v3.3.1", digest: "sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1" }
  requires:
    # 🔴 Vector extensions are NOT installed from SQL: they must be in the
    # PostgreSQL server's image. That is why the catalog's `postgres` service uses
    # Immich's image — see its manifest, and the `reindex-collation` guide that
    # goes with it.
    - kind: database
      engine: postgres
      # cube and earthdistance too, cube first: Immich's geolocation creates them at
      # start, which its isolated role is not allowed to do — it died on "permission
      # denied to create extension earthdistance" (found on a real cluster).
      extensions: [vector, vchord, cube, earthdistance]

    # Queues: indexing, thumbnail generation, transcoding.
    #
    # ⚠️ Shared, not dedicated: Immich prefixes its keys, and one more Valkey
    # instance would cost memory on a node that already lacks it because of
    # transcoding.
    - kind: cache
      engine: valkey

    - kind: sso
      mode: native
      redirectPaths: ["/auth/login", "/api/oauth/mobile-redirect"]

    # 🔴 The photos. The only volume in the catalog we cannot afford to lose AND
    # that grows without bound. On the NAS, then, like Jellyfin's media library —
    # but `backup: true` this time: these are originals, not files you can download
    # again.
    - kind: storage
      name: data
      path: /data
      tier: nfs
      backup: true
  companions:
    # 🔴 The machine-learning service. THIS is what makes Immich useful: face
    # recognition, search by description, object detection.
    #
    # Without it, Immich starts perfectly and imports the photos — and never
    # recognises anyone. Nothing says half the feature is missing. Hence deploying
    # it BEFORE the app, and waiting for it to become healthy.
    - name: machine-learning
      image: { repo: ghcr.io/immich-app/immich-machine-learning, tag: "v3.3.1", digest: "sha256:513c831cfb010ad319341a0c86b42c575a0d5b688d3e8cae346ee624074a58ed" }
      storage:
        # Models downloaded on first use. NOT backed up: they download again, and
        # they weigh several gigabytes.
        - name: cache
          path: /cache
          backup: false
      # ⚠️ Inference is the heaviest load in the whole catalog.
      tier: heavy
      # The models it loads (search, faces) sit in memory: measured at 315 MB idle on
      # the lab before the first search.
      memory: { reserve: 512M, limit: 3G }
      security:
        readOnlyRootfs: false
      healthcheck:
        test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:3003/ping')\" || exit 1"]
  env:
    DB_HOSTNAME: "{{ db.host }}"
    DB_PORT: "{{ db.port }}"
    DB_DATABASE_NAME: "{{ db.name }}"
    DB_USERNAME: "{{ db.user }}"
    DB_PASSWORD_FILE: /run/secrets/db-password

    REDIS_HOSTNAME: "{{ cache.host }}"
    REDIS_PORT: "{{ cache.port }}"

    # 🔴 The companion's address. The token avoids hard-coding
    # "immich-machine-learning": the name is derived from the app and the companion,
    # and the two would stay aligned even if one of them changed.
    IMMICH_MACHINE_LEARNING_URL: "http://{{ companion.machine-learning.host }}:3003"

    IMMICH_PORT: "2283"

    # 🔴 `sso: native` created the client in PocketID; this is what tells Immich. It
    # takes OAuth from its admin screen or from this file, nothing else — and the file
    # makes that whole screen read-only, settings saved there before included: they
    # change here, then `hlb upgrade`. Merged over Immich's defaults, so it holds only
    # what Homelabus decides. Checked against the v3.1.0 image's own schema.
    IMMICH_CONFIG_FILE: /etc/immich/config.yaml
  files:
    - path: /run/secrets/db-password
      content: "{{ db.password }}"
    - path: /etc/immich/config.yaml
      content: |
        oauth:
          enabled: true
          issuerUrl: "{{ oidc.issuer }}"
          clientId: "{{ oidc.client_id }}"
          clientSecret: "{{ oidc.client_secret }}"
          buttonText: Sign in with PocketID
          # The people PocketID knows were invited: each gets an account.
          autoRegister: true
          # Its defaults, said here: what Homelabus writes on the roles' groups.
          roleClaim: immich_role
          storageQuotaClaim: immich_quota
          # The phone apps come back through the server, at the address registered.
          mobileOverrideEnabled: true
          mobileRedirectUri: "https://{{ domain }}/api/oauth/mobile-redirect"
        server:
          # Shared links point here rather than at the container.
          externalDomain: "https://{{ domain }}"
  # Immich reads `immich_role` at every sign-in and `immich_quota` (GiB) only when it
  # creates the account (`auth.service.js`, v3.1.0) — a quota changed afterwards never
  # reached it. The claim covers the first sign-in; the statement keeps the account in
  # step after, on its own table. ⚠️ `0` is no space at all: no quota is no claim.
  access:
    admins:
      level: admin
      means: Immich's administration — its users, libraries, jobs and settings
    claims:
      immich_role: { byLevel: { user: user, admin: admin } }
    quota:
      claim: { name: immich_quota, unit: GiB }
      apply:
        type: sql
        unit: bytes
        statement: >-
          UPDATE "user" SET "quotaSizeInBytes" = {{ quota }}
          WHERE "oauthId" = '{{ person.sub }}'
  ingress:
    - host: "{{ domain }}"
      port: 2283
      # No Anubis: it would break the mobile applications, which do the automatic
      # photo backup — the very feature you install Immich for.
      chain: [caddy-front, caddy-back]
      expose: after-guide
      # `UnauthorizedException('Incorrect email or password')`, Immich 3.3.1.
      authRoutes:
        - paths: [/api/auth/login]
          failsWith: 401
  security:
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
  swarm:
    # Thumbnails and video transcoding run in the server: its peak, not its rest.
    memory: { reserve: 512M, limit: 3G }
    # 🔴 A single instance: uploads arrive in chunks, and a second replica would
    # receive half the chunks of a file the other one is assembling.
    replicas: 1
    tier: heavy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2283/api/server/ping || exit 1"]
  update:
    # 🔴 Immich migrates its schema on every minor version and those migrations are
    # not reversible: an image rollback would leave an already-migrated database
    # facing older code. The update is approved by hand, after a backup.
    channel: pin
