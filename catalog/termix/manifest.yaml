apiVersion: hlb/v1
kind: App
metadata:
  name: termix
  displayName: Termix
  category: security
  homepage: https://github.com/LukeGus/Termix
spec:
  # 2.9.2 at least: the sign-in's group-to-role map (`OIDC_ROLE_MAP`) and a host shared
  # with its sign-in (`shareSshAuth`), which the nodes below rest on, and each account's
  # data key sealed by Termix's own, so an API key reads its credentials. Not v26.10
  # yet: a new major line of 2026-10-10, at its third release in eight days — majors
  # move with the rest of the catalog, rehearsed on a restored copy first.
  # 26.10 rehearsed on 2026-10-19: a 2.9.2 volume migrated, its account and hosts kept,
  # and the whole of `hlb-engine/tests/live_termix.rs` — key, account, hosts, shares,
  # rotation — passed against this image; Termix's API is still the one read at 2.9.2.
  image: { repo: ghcr.io/lukegus/termix, tag: "26.10.5", digest: "sha256:28a627c1e2a568ea8c2d3fd83861675fdd3d8327a09f5a245c399b4864ad5ceb" }
  requires:
    # 🔴 SSO MANDATORY, and native. Termix holds the SSH keys of EVERY machine:
    # compromising it amounts to compromising the whole fleet, including the node
    # carrying the backups. It is the only app in the catalog whose loss is worse than
    # Vaultwarden's — a stolen vault without the master password stays encrypted, an
    # open terminal protects nothing.
    #
    # The callback is the one Termix builds for a provider set by its environment
    # (`/users/oidc/callback`, 2.6.1 and 2.9.2 alike): the path declared before it was
    # wired was not, and PocketID would have refused it.
    - kind: sso
      mode: native
      redirectPaths: ["/users/oidc/callback"]

    # An encrypted SQLite database: hosts, credentials, SSH keys.
    #
    # 🔴 `backup: true` is indispensable AND not enough: the backup holds
    # the fleet's access. It is encrypted by the `age` vault like the rest, and it is
    # precisely for this kind of content that the rule exists.
    - kind: storage
      name: data
      path: /app/data
      tier: local
      backup: true
      sqlite: true
  env:
    # 🔴 `sso: native` created the client in PocketID; this is what tells Termix. It
    # takes no discovery URL: each endpoint is PocketID's own.
    OIDC_ISSUER_URL: "{{ oidc.issuer }}"
    OIDC_AUTHORIZATION_URL: "{{ oidc.issuer }}/authorize"
    OIDC_TOKEN_URL: "{{ oidc.issuer }}/api/oidc/token"
    OIDC_USERINFO_URL: "{{ oidc.issuer }}/api/oidc/userinfo"
    OIDC_CLIENT_ID: "{{ oidc.client_id }}"
    OIDC_CLIENT_SECRET: "{{ oidc.client_secret }}"
    OIDC_IDENTIFIER_PATH: sub
    OIDC_NAME_PATH: preferred_username
    # Its callback is built from the request: behind Caddy, always HTTPS.
    OIDC_FORCE_HTTPS: "true"
    # Whoever PocketID lets in gets an account: the administrator roles only (the floor
    # below), each an administrator of Termix — read from `hlb_termix` at every sign-in,
    # so a role losing its level loses Termix's admin flag at its next one. Before roles,
    # the first to sign in became the administrator and anyone after waited on them.
    OIDC_ALLOW_REGISTRATION: "true"
    OIDC_GROUP_CLAIM: hlb_termix
    OIDC_ADMIN_GROUP: admin
    # The same claim gives the Termix role every node's host is shared with — and is
    # what Homelabus reads to know which role that is (`access.nodes`). Termix makes
    # nothing of a role that does not exist: the node sync makes it.
    OIDC_ROLE_MAP: "admin:homelabus-nodes"

    # 🔴 Its local doors, every one open by default (read on 2.6.1, and found open on a
    # sibling's production on 2026-10-17): a local account signs up, resets its
    # password from a code in the container's log, and signs in on that password
    # alone — the SSO's second factor never asked. Each beats the setting in its
    # database, which a restore brings back as it was. ⚠️ From 2.9.2, password sign-in
    # stays open while no other method works (`forced`): read below as a door open.
    ALLOW_REGISTRATION: "false"
    ALLOW_PASSWORD_RESET: "false"
    ALLOW_PASSWORD_LOGIN: "false"
    # A daily usage report to its publisher, on by default: hosts, users, features.
    ENABLE_TELEMETRY: "false"
  # 🔴 The administrator roles, and no other: Termix holds every machine's SSH access.
  access:
    floor: admin
    admins:
      level: admin
      means: every machine's SSH access, through Termix
    claims:
      hlb_termix: { byLevel: { admin: admin } }
    # 🔴 A host per node, reached as `hlb-termix` — an account on each node with no
    # right beyond a shell — by a key Homelabus generates and authorizes from this
    # app's own node only. Never Homelabus's own key, which provisions the nodes.
    nodes: termix
  # Read from Termix's own public endpoints, the ones its sign-in page asks.
  assertions:
    - id: registration
      holds: nobody creates a local Termix account
      check:
        type: http
        path: /users/registration-allowed
        pointer: /allowed
        equals: false
    - id: password-reset
      holds: no local password is reset from a code in the log
      check:
        type: http
        path: /users/password-reset-allowed
        pointer: /allowed
        equals: false
    - id: password-login
      holds: nobody signs in to Termix with a password, past the SSO
      check:
        type: http
        path: /users/password-login-allowed
        pointer: /allowed
        equals: false
    - id: telemetry
      holds: Termix reports nothing to its publisher
      check: { type: env, name: ENABLE_TELEMETRY, equals: "false" }
  ingress:
    - host: "{{ domain }}"
      port: 8080
      # 🔴 PRIVATE, non-negotiable. A web SSH client reachable from the internet is a
      # way in to every machine, protected by a single password. `after-guide` would
      # not be enough: it is not the first registrant's window that is at stake, it is
      # the exposure itself.
      chain: [caddy-back]
      expose: private
  security:
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID]
  swarm:
    memory: { reserve: 128M, limit: 512M }
    # A single instance: its database is a local SQLite.
    replicas: 1
    tier: light
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
  update:
    # 🔴 `pin` like Vaultwarden, and for an even stronger reason: an automatic update
    # of a tool that holds the fleet's access gets approved by hand. An image rollback
    # would not give back a secret that had leaked.
    channel: pin
