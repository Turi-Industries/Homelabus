# What the deployment alone does not cover.
steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      At your registrar, point {{ domain }} at the cluster.

      If a wildcard *.{{ base_domain }} already exists, there is nothing to do.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: understand-the-risk
    title: What this app concentrates
    phase: pre-install
    severity: blocking
    body: |
      🔴 Termix holds the SSH keys of every one of your machines.

      Compromising it means losing the whole fleet — including the node that
      carries the backups, and therefore including the means of recovering from
      it. It is the only app in the catalog whose loss is worse than
      Vaultwarden's: a stolen vault without its master password stays
      encrypted, an already-open terminal protects nothing.

      Two consequences, enforced by the manifest:
        - PRIVATE exposure, never public, even after the guide is validated;
        - `channel: pin` — no automatic update.

      If you do not need a terminal in the browser, the right decision is not to
      install it. `hlb access grant` already covers SSH access.

  - id: let-homelabus-in
    title: Let Homelabus give Termix the nodes
    phase: post-install
    severity: required
    body: |
      Homelabus puts every node of the cluster in Termix: on each, an account
      `hlb-termix` with no right beyond a shell — no sudo, no docker — and a key
      Homelabus generates, accepted from Termix's own node only. Never
      Homelabus's own key, which provisions the nodes.

      Termix lets no program make its first API key, so you hand Homelabus one,
      once:
        1. Sign in to {{ domain }} through PocketID, as an administrator.
        2. Administration → API Keys → create one for yourself, expiring
           tomorrow.
        3. Run `hlb termix connect --apply` and paste it when asked.

      Homelabus makes its own Termix account and key with it, deletes yours,
      and gives every node a host shared with the administrators. A node that
      leaves the cluster leaves Termix the same night; `hlb termix rotate
      --apply` changes the key everywhere without shutting Termix out.

      At your first connection to a node, Termix asks you to accept its host
      key: `hlb termix sync` prints each one, to compare.

  - id: sso-mandatory
    title: Check that the SSO really is active
    phase: post-install
    severity: blocking
    after: [let-homelabus-in]
    body: |
      Open {{ domain }} in a private window.

      You must be sent to PocketID **before** you see any terminal at all. If a
      local sign-in form appears, the OIDC is not being taken and the app is
      protected by a single password: stop there.
    deeplink: "https://{{ domain }}/"
