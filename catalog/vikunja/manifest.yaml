apiVersion: hlb/v1
kind: App
metadata:
  name: vikunja
  displayName: Vikunja
  category: productivity
  homepage: https://vikunja.io
spec:
  image: { repo: vikunja/vikunja, tag: "0.24" }
  requires:
    - kind: database
      engine: postgres
    - kind: sso
      mode: native
      redirectPaths: ["/auth/openid/pocketid"]
    - kind: storage
      name: files
      path: /app/vikunja/files
      tier: local
      backup: true
    - kind: smtp
  # §4.3 — Vikunja lit sa configuration par des variables VIKUNJA_*.
  env:
    VIKUNJA_DATABASE_TYPE: postgres
    VIKUNJA_DATABASE_HOST: "{{ db.host }}"
    VIKUNJA_DATABASE_DATABASE: "{{ db.name }}"
    VIKUNJA_DATABASE_USER: "{{ db.user }}"
    VIKUNJA_DATABASE_PASSWORD: "{{ db.password }}"

    # Sans elle, les liens de partage et les invitations pointent vers localhost.
    VIKUNJA_SERVICE_PUBLICURL: "https://{{ domain }}/"
  ingress:
    - host: "{{ domain }}"
      port: 3456
      chain: [caddy-front, anubis, caddy-back]
      expose: after-guide
  security:
    # Ces apps écrivent dans leur rootfs au démarrage (configuration, cache) et
    # abandonnent leurs privilèges vers un utilisateur non root.
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
  swarm:
    replicas: 2          # stateless → HA réelle via le routing mesh (§2bis.3)
    tier: light
  update:
    channel: minor
