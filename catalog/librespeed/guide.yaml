# What the deployment alone does not cover.
steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      At your registrar, point {{ domain }} at the cluster.

      If a wildcard *.{{ base_domain }} already exists, there is nothing to do.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: standalone
    title: Standalone mode, no telemetry
    phase: post-install
    severity: tip
    body: |
      LibreSpeed runs standalone and records NO result.

      Enabling telemetry would require a database and would keep every visitor's
      IP address — for a public app, that is one more log file to protect, with
      nothing in return.
    automate:
      - method: env
        vars:
          MODE: standalone
          TELEMETRY: "false"
          TITLE: "Throughput — {{ base_domain }}"
