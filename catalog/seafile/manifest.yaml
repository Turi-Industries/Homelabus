apiVersion: hlb/v1
kind: App
metadata:
  name: seafile
  displayName: Seafile
  category: files
  homepage: https://www.seafile.com
spec:
  # Community edition (`-mc`). ⚠️ S3 object storage is a PRO feature: no point
  # declaring an `object-storage` capability here, it would not be read.
  image: { repo: seafileltd/seafile-mc, tag: "14.0.9", digest: "sha256:75d8b88e8bfaa54099082aec0e99ff1a962bd364bfc21da34125fa66998f0861" }
  requires:
    # 🔴 THREE databases, a single role. Seafile separates its directory (ccnet), its
    # libraries (seafile) and its web interface (seahub) — and connects to them with
    # one single account. This is the case that moved the role from the database name
    # to the app name.
    # seaf-server opens a pool of `max_connections` (40, below) on ccnet_db and on
    # seafile_db, its Go file server 16 more; seahub and seafevents the rest (14.0).
    - kind: database
      engine: mariadb
      name: ccnet_db
      connections: 40
    - kind: database
      engine: mariadb
      name: seafile_db
      connections: 56
    - kind: database
      engine: mariadb
      name: seahub_db
      connections: 20

    # Cache and sessions. Seafile 13 expects a Redis; Valkey is one.
    - kind: cache
      engine: valkey

    # Native: seahub's OAuth, configured in the Python file below. Behind the portal,
    # the desktop and phone clients — which are not browsers — could not sync at all.
    # The callback is seahub's own route (`seahub/oauth/urls.py`, 13.0.25).
    - kind: sso
      mode: native
      redirectPaths: ["/oauth/callback/"]

    # All the data: libraries, files, configuration, logs.
    - kind: storage
      name: shared
      path: /shared
      # 🔴 Local, not NFS: on a share every file belongs to the NFS owner, and Seafile
      # run as root refuses to start over files it does not own; its non-root mode
      # demands a 777 directory it creates itself as 755. On the storage node, under
      # HLB_STORAGE_ROOT, the data is still a dataset of the pool (found on a real
      # cluster, 2026-10-17).
      tier: local
      backup: true

    - kind: smtp
  env:
    SEAFILE_MYSQL_DB_HOST: "{{ db.host }}"
    SEAFILE_MYSQL_DB_PORT: "{{ db.port }}"
    SEAFILE_MYSQL_DB_USER: "{{ db.user }}"

    # ⚠️ Written literally, NOT via {{ db.name }}: with three databases the token
    # would be ambiguous. These names are a Seafile choice, not a topology fact.
    SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
    SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
    SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
    # 🔴 The databases and their account already exist — Homelabus created them, and
    # never hands out MariaDB's root. Without this, the first start asks for root to
    # create them, is refused, and Seafile never starts (found on a real cluster).
    USE_EXISTING_DB: "1"
    # 🔴 Seafile 13 refuses to start without it. Generated once into the vault and
    # never replaced: a new key invalidates every session mid-flight. Until 2026-10-17
    # a guide asked for it to be deposited, and nothing passed it to the container.
    # Read from `/run/secrets/jwt-key` by the start below, with the database's
    # password and the administrator's.

    CACHE_PROVIDER: redis
    REDIS_HOST: "{{ cache.host }}"
    REDIS_PORT: "{{ cache.port }}"

    # 🔴 Without these two lines, Seafile builds its share links in http:// and on
    # its container name — the links you send someone do not open.
    SEAFILE_SERVER_HOSTNAME: "{{ domain }}"
    SEAFILE_SERVER_PROTOCOL: https

    SEAFILE_LOG_TO_STDOUT: "true"
    # The file server in Go: noticeably faster on large repositories. Read by
    # `seafile.sh` and `seaserv` (not by the image's `/scripts`, which is where a search
    # for it once concluded nothing read it).
    ENABLE_GO_FILESERVER: "true"

    # Read once, at the first start, into the volume's `seahub_settings.py`; the start
    # script below keeps that line in step after it.
    TIME_ZONE: "{{ timezone }}"

    # The notification server, the companion below: clients learn of a change as it
    # happens instead of polling for it. The browser and the sync clients reach it
    # through the route's `/notification`, the server on the overlay.
    ENABLE_NOTIFICATION_SERVER: "true"
    NOTIFICATION_SERVER_URL: "https://{{ domain }}/notification"
    INNER_NOTIFICATION_SERVER_URL: "http://{{ companion.notification.host }}:8083"

    # 🔴 Without these the image's first start creates `me@example.com` / `asecret`
    # (`/scripts/start.py`, 13.0.25), an administrator any visitor can sign in as.
    # The address is the one Seafile sends from — an account the installation owns —
    # and the password is generated into the vault: `hlb secret-get
    # seafile-admin-password`. Read at the first start only: an installation that
    # began without them keeps its `me@example.com` until it is deleted, which the
    # assertion below reports.
    INIT_SEAFILE_ADMIN_EMAIL: "{{ smtp.from }}"

    # ⚠️ Non-root refused here: the image drops privileges itself at startup, and
    # its non-root mode demands a 777 data directory it then creates as 755.
    NON_ROOT: "false"
  # 🔴 `smtp` was declared and read by nothing: Seafile 13 takes no mail setting from
  # its environment, only from Python. Seahub imports `seahub/local_settings.py`
  # before the volume's `seahub_settings.py` — inside a directory named after the
  # version (`seafile-server-13.0.25`), so the file is mounted where no update moves
  # it and linked there at every start; the image's own start follows. The
  # `-latest` link cannot be used: the image makes it at start, and a mount there
  # first would stop it. Django's `sendtestemail` reached a Stalwart mailbox through
  # it on 2026-10-18.
  #
  # Seahub reaches PocketID with `requests`, which trusts certifi's bundle and nothing
  # else — not the `SSL_CERT_DIR` Homelabus's root is put in. Under a private
  # authority the token exchange failed on the certificate; `REQUESTS_CA_BUNDLE`
  # replaces certifi's, so it is given the system's roots AND Homelabus's.
  #
  # `seafile.conf` is the volume's, written by the image at the first start and
  # edited by whoever administers Seafile since: the start script sets the keys
  # Homelabus owns and leaves every other one as it is.
  command: [/bin/bash, /run/hlb/seafile-start.sh]
  files:
    - path: /run/secrets/db-password
      content: "{{ db.password }}"
    - path: /run/secrets/jwt-key
      content: "{{ secret.jwt-key }}"
    - path: /run/secrets/admin-password
      content: "{{ secret.admin-password }}"
    - path: /run/hlb/seafile-start.sh
      content: |
        set -e
        # 🔴 The secrets, from their files, for this process and what it starts — never
        # the service's environment, which `docker inspect` shows. Seafile reads all
        # three from its environment only: its own `SEAFILE_SECRETS_FILE` is read by
        # `enterpoint.sh`, after the creation below has needed the password.
        SEAFILE_MYSQL_DB_PASSWORD=$(cat /run/secrets/db-password)
        JWT_PRIVATE_KEY=$(cat /run/secrets/jwt-key)
        INIT_SEAFILE_ADMIN_PASSWORD=$(cat /run/secrets/admin-password)
        export SEAFILE_MYSQL_DB_PASSWORD JWT_PRIVATE_KEY INIT_SEAFILE_ADMIN_PASSWORD
        for d in /opt/seafile/seafile-server-*/seahub/seahub; do
          ln -sf /run/hlb/seahub_local_settings.py "$d/local_settings.py"
        done
        if [ -f /run/hlb/trust/roots.pem ]; then
          cat /etc/ssl/certs/ca-certificates.crt /run/hlb/trust/roots.pem > /tmp/hlb-roots.pem
          export REQUESTS_CA_BUNDLE=/tmp/hlb-roots.pem
        fi
        # 🔴 The image creates the volume's configuration at its first start and
        # starts the server straight after (`/scripts/start.py`, 13.0.25): run that
        # creation here first — it does nothing on a volume that has it — so the
        # keys are in place before anything reads them.
        # The image's `start.py` makes them before its first-start creation, which
        # moves the configuration into `/shared/seafile`: skipped, a fresh volume
        # failed there ("No such file or directory") and Seafile never started.
        mkdir -p /shared/seafile /bootstrap/generated
        python3 -c 'import sys; sys.path.insert(0, "/scripts")
        from utils import wait_for_mysql
        from bootstrap import init_seafile_server
        wait_for_mysql(); init_seafile_server()'
        python3 /run/hlb/seafile-conf.py
        exec /sbin/my_init -- /scripts/enterpoint.sh
    - path: /run/hlb/seafile-conf.py
      content: |
        # The keys Homelabus owns in the volume's configuration; every other key, and
        # every other line, is left as it is.
        import configparser, os, re

        OWNED = {
            # 🔴 Two pools of this size in seaf-server (seafile_db and ccnet_db), the
            # file server's 16 besides, seahub's and seafevents' own: at Seafile's
            # default of 100, more than MariaDB's 151 (`seaf-utils.c`, 13.0).
            "database": {"max_connections": "40"},
            # A library's history is kept 90 days, unless its owner chose otherwise:
            # what the weekly garbage collection may free after that. Without it,
            # nothing a person deleted is ever freed.
            "history": {"keep_days": "90"},
        }

        conf = "/shared/seafile/conf/seafile.conf"
        c = configparser.ConfigParser(interpolation=None, strict=False)
        c.optionxform = str
        c.read(conf)
        changed = False
        for section, keys in OWNED.items():
            if not c.has_section(section):
                c.add_section(section)
            for key, value in keys.items():
                if c.get(section, key, fallback=None) != value:
                    c.set(section, key, value)
                    changed = True
        if changed:
            with open(conf + ".hlb", "w") as f:
                c.write(f)
            os.replace(conf + ".hlb", conf)

        # The zone the image wrote at the first start, followed: an installation
        # given its zone after Seafile was installed is told it here.
        zone = os.environ.get("TIME_ZONE", "")
        settings = "/shared/seafile/conf/seahub_settings.py"
        if zone and os.path.exists(settings):
            text = open(settings).read()
            line = "TIME_ZONE = '%s'" % zone
            new = re.sub(r"(?m)^TIME_ZONE\s*=.*$", line, text)
            if new == text and line not in text:
                new = text.rstrip("\n") + "\n" + line + "\n"
            if new != text:
                with open(settings + ".hlb", "w") as f:
                    f.write(new)
                os.replace(settings + ".hlb", settings)
    # A person's quota, set by Homelabus person by person (`access.quota` below).
    # Seafile's own per-role quotas are a Pro feature; `seafile_api.set_user_quota` is
    # the Community edition's, through its RPC socket — in the container only. Tried
    # on 13.0.25: set, "none" back to unlimited (-2), and 3 for someone not signed in.
    - path: /run/hlb/seafile-quota.sh
      content: |
        # $1: the person's PocketID id, which seahub keeps as their OIDC uid.
        # $2: the quota in bytes, or "none".
        # Exits 3 when the person has no Seafile account yet — they never signed in.
        set -e
        I=/opt/seafile/seafile-server-latest
        export SEAFILE_CENTRAL_CONF_DIR=/opt/seafile/conf SEAFILE_CONF_DIR=/opt/seafile/seafile-data
        export SEAFILE_RPC_PIPE_PATH=$I/runtime
        export PYTHONPATH=$I/seafile/lib/python3/site-packages:$I/seafile/lib64/python3/site-packages:$I/seahub/thirdpart
        exec python3 - "$@" <<'PY'
        import os, sys
        import pymysql
        from seaserv import seafile_api
        sub, quota = sys.argv[1], sys.argv[2]
        db = pymysql.connect(
            host=os.environ["SEAFILE_MYSQL_DB_HOST"],
            port=int(os.environ.get("SEAFILE_MYSQL_DB_PORT", "3306")),
            user=os.environ["SEAFILE_MYSQL_DB_USER"],
            # A `docker exec` has the service's environment, which holds no secret.
            password=open("/run/secrets/db-password").read(),
            database=os.environ.get("SEAFILE_MYSQL_DB_SEAHUB_DB_NAME", "seahub_db"),
        )
        with db.cursor() as c:
            c.execute(
                "SELECT username FROM social_auth_usersocialauth WHERE provider = %s AND uid = %s",
                ("pocket-id", sub),
            )
            row = c.fetchone()
        if row is None:
            sys.exit(3)
        # -2 is Seafile's own "no quota".
        if seafile_api.set_user_quota(row[0], -2 if quota == "none" else int(quota)) != 0:
            sys.exit("seafile refused the quota")
        PY
    - path: /run/hlb/seahub_local_settings.py
      content: |
        EMAIL_USE_TLS = True
        EMAIL_HOST = "{{ smtp.host }}"
        EMAIL_PORT = {{ smtp.port }}
        EMAIL_HOST_USER = "{{ smtp.user }}"
        EMAIL_HOST_PASSWORD = "{{ smtp.password }}"
        DEFAULT_FROM_EMAIL = "Seafile <{{ smtp.from }}>"
        SERVER_EMAIL = "{{ smtp.from }}"

        # 🔴 `sso: native` created the client in PocketID; this is what tells seahub.
        # A person is known by PocketID's `sub`, created at the first sign-in.
        ENABLE_OAUTH = True
        OAUTH_CREATE_UNKNOWN_USER = True
        OAUTH_ACTIVATE_USER_AFTER_CREATION = True
        OAUTH_PROVIDER = "pocket-id"
        OAUTH_CLIENT_ID = "{{ oidc.client_id }}"
        OAUTH_CLIENT_SECRET = "{{ oidc.client_secret }}"
        OAUTH_REDIRECT_URL = "https://{{ domain }}/oauth/callback/"
        OAUTH_AUTHORIZATION_URL = "{{ oidc.issuer }}/authorize"
        OAUTH_TOKEN_URL = "{{ oidc.issuer }}/api/oidc/token"
        OAUTH_USER_INFO_URL = "{{ oidc.issuer }}/api/oidc/userinfo"
        OAUTH_SCOPE = ["openid", "profile", "email"]
        OAUTH_ATTRIBUTE_MAP = {
            "sub": (True, "uid"),
            "name": (False, "name"),
            "email": (False, "contact_email"),
        }
        # No sign-up form: people come through PocketID. Seahub's default, said here
        # so the assertion below reads what this file decides.
        ENABLE_SIGNUP = False

        # A large file from the browser goes up in pieces, and an interrupted upload
        # resumes where it stopped instead of from nothing — what a slow uplink
        # needs. Measured on 2026-10-18, it changes nothing to the speed: a gigabyte
        # takes the same time, and its "stuck at 100 %" is the server cutting the
        # file into blocks once it is all there, which waits on the disk.
        ENABLE_RESUMABLE_FILEUPLOAD = True

        # The configuration is this file and the volume's. Settings changed in the
        # web administration are kept in the database and beat both, unseen here.
        ENABLE_SETTINGS_VIA_WEB = False

        # Seahub answers to its own name only: a request carrying another `Host` — a
        # mail link forged to point elsewhere — is refused. The service's name and
        # the loopback are the probe's and the assertions'.
        ALLOWED_HOSTS = ["{{ domain }}", "seafile", "localhost", "127.0.0.1"]

        # Encrypted libraries in version 4 (a random salt each) with their password
        # through argon2id, Seafile's own recommendation (13.0's manual). Sync
        # clients from 9.0.9 open them.
        ENCRYPTED_LIBRARY_VERSION = 4
        ENCRYPTED_LIBRARY_PWD_HASH_ALGO = "argon2id"
        ENCRYPTED_LIBRARY_PWD_HASH_PARAMS = "2,102400,8"
  access:
    quota:
      apply:
        type: exec
        unit: bytes
        command: [/bin/bash, /run/hlb/seafile-quota.sh, "{{ person.sub }}", "{{ quota }}"]
  ingress:
    - host: "{{ domain }}"
      port: 80
      # No Anubis: the desktop sync client is not a browser and would solve no
      # challenge.
      chain: [caddy-front, caddy-back]
      expose: after-guide
      # Websockets, its prefix taken off: the server answers `/ping` and `/`.
      paths:
        - { prefix: /notification, companion: notification, port: 8083 }
      # The clients' token endpoint answers a wrong password 400 (a serializer's
      # `ValidationError`, seahub 13.0); the web form shows itself again, a 200.
      authRoutes:
        - paths: [/api2/auth-token/]
          failsWith: 400
        - paths: [/accounts/login/]
  # The notification server, a separate image since Seafile 12 and the same in the
  # community edition. It reads the app's two databases and signs nothing of its own:
  # the JWT key is the app's.
  companions:
    - name: notification
      image: { repo: seafileltd/notification-server, tag: "14.0.8", digest: "sha256:f442e9ae3a12f0f30371e054f30b8edf692a20e1331a6b81d4e5f51d49de8e94" }
      env:
        SEAFILE_MYSQL_DB_HOST: "{{ db.host }}"
        SEAFILE_MYSQL_DB_PORT: "{{ db.port }}"
        SEAFILE_MYSQL_DB_USER: "{{ db.user }}"
        SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
        SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
        SEAFILE_LOG_TO_STDOUT: "true"
        NOTIFICATION_SERVER_LOG_LEVEL: info
        TIME_ZONE: "{{ timezone }}"
      # The server reads its two secrets from its environment only (14.0.8): set from
      # their files for the process alone, then the image's own `Cmd`.
      command:
        - /bin/sh
        - -c
        - >-
          SEAFILE_MYSQL_DB_PASSWORD=$(cat /run/secrets/db-password)
          JWT_PRIVATE_KEY=$(cat /run/secrets/jwt-key)
          exec /opt/seafile/notification-server -c /opt/seafile
          -l /shared/seafile/logs/notification-server.log
      files:
        - path: /run/secrets/db-password
          content: "{{ db.password }}"
        - path: /run/secrets/jwt-key
          content: "{{ secret.jwt-key }}"
      memory: { reserve: 16M, limit: 128M }
      # No curl in the image: bash's own socket.
      healthcheck:
        test:
          - CMD
          - bash
          - -c
          - exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /ping HTTP/1.0\r\n\r\n' >&3 && grep -q pong <&3
  security:
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
  swarm:
    memory: { reserve: 512M, limit: 2G }
    # 🔴 A single instance: the state of the libraries is held in memory by the
    # server, and two replicas would contradict each other on what is already synced.
    replicas: 1
    tier: heavy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/api2/ping/ || exit 1"]
  update:
    # Schema migrations on every minor version, not reversible.
    channel: pin
  assertions:
    - id: no-default-admin
      holds: the image's default administrator me@example.com does not exist
      check:
        type: sql
        database: ccnet_db
        query: SELECT count(*) FROM EmailUser WHERE email = 'me@example.com'
        equals: "0"
      # The installation began without INIT_SEAFILE_ADMIN_*: its administrator is the
      # image's, and the vault's password opens nothing. Done this way on the lab.
      fix: >-
        Sign in as me@example.com with the password asecret. In System Admin → Users, add
        the address Seafile sends mail from as an administrator, with the password
        `hlb secret-get seafile-admin-password`. Move me@example.com's libraries to it
        (Libraries → Transfer), then delete me@example.com.
    - id: sign-in-through-pocketid
      holds: people sign in to Seafile through PocketID
      check: { type: http, path: /oauth/login/, status: [302] }
    - id: signups-closed
      holds: nobody creates a Seafile account from its sign-up page
      check: { type: http, path: /accounts/register/, status: [404] }
    - id: own-name-only
      holds: Seahub refuses a request made to a name other than its own
      check: { type: http, path: /api2/ping/, host: elsewhere.invalid, status: [400] }
  # Online since Seafile 12 in the community edition too (`/scripts/gc.sh`: "online
  # garbage collection", 13.0.25): the server keeps running. Freed 2.8 GB of four
  # deleted libraries on the lab in under a second.
  jobs:
    - id: gc
      does: frees the blocks no library references, and history past its 90 days
      every: week
      # 🔴 `seaf-gc.sh` stops without `JWT_PRIVATE_KEY`, and a `docker exec` has the
      # service's environment only, which holds no secret: given here from its file.
      command:
        - /bin/bash
        - -c
        - JWT_PRIVATE_KEY=$(cat /run/secrets/jwt-key) exec /scripts/gc.sh
  # The administrator made at the first start — the sync clients' way in too.
  recovery:
    - secret: admin-password
      username: "{{ smtp.from }}"
      path: /accounts/login/
      # Seahub's token endpoint: 400 to a refusal (13.0.25, and 14.0.9 from an empty
      # volume).
      proof:
        path: /api2/auth-token/
        body: '{"username":"{{ username }}","password":"{{ password }}"}'
        pointer: /token
