# What the deployment alone does not cover.
steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      At your registrar, point {{ domain }} at the cluster.

      If a wildcard *.{{ base_domain }} already exists, there is nothing to do.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: shared-on-the-pool
    title: Put Seafile's data on the pool
    phase: pre-install
    severity: blocking
    body: |
      The `seafile-shared` volume holds every library, file and setting. Install
      with `HLB_STORAGE_ROOT` pointing at the pool (`hlb storage init` prints it):
      the volume is then a dataset of its own, snapshotted, and Seafile runs on
      the storage node.

      ⚠️ Without it, the data sits in Docker's directory of whichever node Seafile
      landed on — kept across redeployments, but on that machine's system disk.

  - id: admin-account
    title: Keep the administrator's password
    phase: post-install
    severity: blocking
    body: |
      People sign in through PocketID. Seafile's own administrator — for when
      PocketID cannot — is the address Seafile sends mail from, seafile@ your
      mail domain, with a password generated at the install:

        hlb secret-get seafile-admin-password

      Put it in your password manager. Until this is done, Seafile stays
      reachable from the VPN only — that is what `expose: after-guide`
      guarantees.
    deeplink: "https://{{ domain }}/accounts/login/"
    # Attested: keeping a password is a person's act, and `/api2/ping/` only said
    # Seafile runs.
    verify:
      type: attest

  - id: no-s3
    title: Understand the storage limit
    phase: post-install
    severity: tip
    after: [admin-account]
    body: |
      The community edition stores everything on its volume. Object storage
      (S3, and therefore Garage) is a PRO edition feature and does not switch on
      here, whatever the configuration.

      Concretely: the size of the pool is the limit, and the restic backup
      copies those files one by one. Over several hundred gigabytes, check how
      long a full backup takes before depending on it.

  - id: history-and-space
    title: Know how long deleted files stay
    phase: post-install
    severity: tip
    after: [admin-account]
    body: |
      A file deleted or overwritten stays in its library's history for 90 days,
      unless the library's owner chose another length in its settings; a
      deleted library stays 30 days in the administrators' trash.

      Every week, Homelabus runs Seafile's garbage collection, which frees the
      space of what is past both. Until then, deleting frees nothing on the
      pool. `hlb job` shows its last run.

  # Run by `hlb backup restore`, never by an install: a database put back from one
  # night and blocks from another disagree, and Seafile serves the file until someone
  # downloads it. Check only — `-r` would rewrite the libraries to what is left.
  # `seaf-fsck.sh` exits 0 whatever it found (its binary returns 0, the script ends on
  # `echo Done.`): the lines it prints are judged, the damaged ones sent to stderr so
  # a refusal names the first. Measured on 13.0.25 with one block set aside: "block
  # … is missing", then "file … is damaged". Its keys come from the files the start
  # reads, through the environment, never an argument.
  - id: check-the-libraries
    title: Check every library against its blocks
    phase: post-restore
    body: |
      Each library's commits, folders and files are read against the blocks on disk.
      A damaged or missing one is named; nothing is repaired. To run it again:

        docker exec $(docker ps -qf name=seafile) sh -c 'JWT_PRIVATE_KEY=$(cat /run/secrets/jwt-key) \
          SEAFILE_MYSQL_DB_PASSWORD=$(cat /run/secrets/db-password) \
          /opt/seafile/seafile-server-latest/seaf-fsck.sh'

      A damaged library is restored again from an older night, or repaired to what
      is left with `seaf-fsck.sh -r <library id>`, which deletes what it cannot read.
    automate:
      - method: exec
        command:
          - sh
          - -c
          - |
            out=$(JWT_PRIVATE_KEY=$(cat /run/secrets/jwt-key) \
              SEAFILE_MYSQL_DB_PASSWORD=$(cat /run/secrets/db-password) \
              /opt/seafile/seafile-server-latest/seaf-fsck.sh 2>&1)
            if printf '%s\n' "$out" | grep -E 'is damaged|is missing|need to restore' >&2; then
              exit 1
            fi
            printf '%s\n' "$out" | grep -q 'seaf-fsck run done' && exit 0
            printf '%s\n' "$out" | grep -v '^$' >&2
            exit 1
