# What the deployment alone does not cover.
steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      At your registrar, point {{ domain }} at the cluster.

      If a wildcard *.{{ base_domain }} already exists, there is nothing to do.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: call-ports
    title: Open the ports calls arrive on
    phase: post-install
    severity: required
    body: |
      Voice and video do not go through the web server: they arrive on two
      ports of their own, straight to the machine your router already forwards
      80 and 443 to — the ingress's, where Fluxer's LiveKit runs.

      On your router, forward to that machine:

        7881/tcp
        7882/udp

      Without them, text, files and the rest work from everywhere, and no call
      connects. A call from a phone on mobile data is the test: it is the one
      that crosses the router.

      ⚠️ A call is always made to the house's public address, from inside the
      house too: it connects there only if your router sends back to the house
      what the house sends to its own public address (hairpin NAT, sometimes
      called "NAT loopback"). Most do; if a call from a phone on the home Wi-Fi
      never connects while the one on mobile data does, yours does not.
    # Attested: nothing inside the house can reach its own public address the
    # way the internet does, and UDP answers no probe.
    verify:
      type: attest

  - id: first-sign-in
    title: Sign in through PocketID
    phase: post-install
    severity: blocking
    after: [dns-record]
    body: |
      People sign in with PocketID, and Fluxer makes their account the first
      time; there is no sign-up form and no password. Those whose role is at the
      administrator level are made Fluxer's administrators at the next role
      sync after their first sign-in (`hlb role sync`), and lose it when their
      role does.

      Until this is done, Fluxer stays reachable from the VPN only.

      ⚠️ Fluxer signs nobody in while PocketID is down: there is no password to
      fall back on. Its administration stays reachable from the cluster itself,
      through the operator socket of its api:

        docker exec -i $(docker ps -qf name=fluxer-api) \
          node bin/operator-relay.mjs <<< '{"target":"operator","method":"GET","path":"/admin/users/@me"}'
    deeplink: "https://{{ domain }}/login"
    # Attested: no page open to all says whether a person has signed in.
    verify:
      type: attest

  - id: search-after-restore
    title: Restore Fluxer whole, from one night
    phase: post-install
    severity: tip
    body: |
      Fluxer whole is its database, its queued jobs and its files — take all three
      from the same night, or a message points at an attachment the bucket no longer
      holds. Each stops Fluxer meanwhile and keeps a copy of what it replaces:

        hlb backup restore fluxer --database --apply
        hlb backup restore fluxer fluxer-nats-data --apply
        hlb backup restore fluxer fluxer --apply

      The search index is not backed up: it is made from the database, and each
      restore asks for the messages' to be rebuilt once Fluxer runs again.
    verify:
      type: attest

  # Run by `hlb backup restore`, never by an install. Judged by the job's end, read
  # back from the api: the relay exits 0 whatever the api said, and the api's 200 says
  # the job was QUEUED — the worker then failed it, and nothing else said so.
  # 🔴 On Meilisearch, 2026.1026 and 2026.1027 initialise the threads' index only
  # when something asks it to be ready, and the `all` refresh empties it without
  # asking: "Meilisearch adapter not initialised", the messages never reached. A
  # `threads` refresh of one community asks first, in the worker that then runs
  # `all` — proven on the lab, the messages' index back from 0. Any real community
  # does: a made-up id would leave a marker row behind. With none, `all` fails as
  # before. Drop the first refresh once Fluxer asks before it empties.
  - id: rebuild-message-search
    title: Rebuild the messages' search index
    phase: post-restore
    body: |
      The communities' and people's indexes refill by themselves; the messages'
      come back when asked, from Fluxer's api. Ask first for one community's
      threads (its id from GET /admin/guilds?limit=1) — the full refresh fails
      without it — then for everything, and read each job's state with
      GET /admin/search/index-refreshes/<job_id> the same way:

        docker exec -i $(docker ps -qf name=fluxer-api) node bin/operator-relay.mjs \
          <<< '{"target":"operator","method":"POST","path":"/admin/search/indexes/threads/refreshes","body":{"guild_id":"<id>"}}'
        docker exec -i $(docker ps -qf name=fluxer-api) node bin/operator-relay.mjs \
          <<< '{"target":"operator","method":"POST","path":"/admin/search/indexes/all/refreshes","body":{}}'
    automate:
      - method: exec
        service: api
        command:
          - sh
          - -c
          - |
            relay() { node bin/operator-relay.mjs; }
            job_id() { sed -n 's/.*"job_id":"\([0-9]*\)".*/\1/p'; }
            refresh() {
              r=$(printf '{"target":"operator","method":"POST","path":"/admin/search/indexes/%s/refreshes","body":%s}\n' "$1" "$2" | relay)
              id=$(printf '%s' "$r" | job_id)
              if [ -z "$id" ]; then printf '%s\n' "$r" >&2; return 1; fi
              i=0
              while [ "$i" -lt 720 ]; do
                s=$(printf '{"target":"operator","method":"GET","path":"/admin/search/index-refreshes/%s"}\n' "$id" | relay)
                case "$s" in
                  *'"status":"completed"'*) return 0 ;;
                  *'"status":"failed"'*) printf '%s refresh %s failed: %s\n' "$1" "$id" "$(printf '%s' "$s" | grep -o '"error":"[^"]*"')" >&2; return 1 ;;
                esac
                i=$((i + 1))
                sleep 5
              done
              echo "$1 refresh $id still not done after an hour" >&2
              return 1
            }
            guild=$(echo '{"target":"operator","method":"GET","path":"/admin/guilds?limit=1"}' | relay \
              | sed -n 's/.*"guilds":\[{"id":"\([0-9]*\)".*/\1/p')
            if [ -n "$guild" ]; then refresh threads "{\"guild_id\":\"$guild\"}" || exit 1; fi
            refresh all '{}'

  - id: phone-notifications
    title: Notifications on a phone come to the installed app
    phase: post-install
    severity: tip
    body: |
      Fluxer sends a push notification only to the site installed as an app — on a
      phone, "Add to Home Screen" — once its notifications are allowed. A browser
      tab is told while it is open, and nothing reaches it once it is closed. A
      computer that was used in the last ten minutes holds the phone's back (Settings
      → Notifications → "Push notification inactive timeout").
    verify:
      type: attest
