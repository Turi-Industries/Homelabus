apiVersion: hlb/v1
kind: App
metadata:
  name: fluxer
  displayName: Fluxer
  category: communication
  homepage: https://fluxer.app
spec:
  # The web client's server. Everything else is a companion, as Fluxer's own compose
  # bundle (`fluxer-compose-2026.1026.223737`) lays it out — every Fluxer image pinned
  # to that release, each tagged by its own build time.
  image: { repo: ghcr.io/fluxerapp/fluxer-app-proxy-self-hosted, tag: "2026.1027.190751", digest: "sha256:aec368cfc99c4a0e55e8be06d8f4e5e9b8720cd7f1068b0c7610e858e514a59e" }
  requires:
    # One JSONB table (`fluxer_kv`) that the api, the worker, `users` and `messages`
    # each create at their start, as the database's owner: no extension.
    - kind: database
      engine: postgres
    - kind: sso
      mode: native
      redirectPaths: ["/auth/sso/callback"]
    - kind: smtp
    # 🔴 Four buckets that must EXIST before the first start: Fluxer creates none when
    # its store is not its own SeaweedFS. The client never reaches them — every upload
    # goes through the media proxy at /media —, so Garage stays private.
    #
    # Attachments, avatars, emoji, banners: what cannot be lost.
    - kind: object-storage
      bucket: fluxer
    # Staging: a file waits here until its message is sent, then moves to `fluxer`.
    # What a day leaves is litter — an upload never sent, a screen-share preview.
    - kind: object-storage
      bucket: fluxer-uploads
      backup: false
      expireAfterDays: 1
    # Moderation evidence: may be the only copy once the original is deleted.
    - kind: object-storage
      bucket: fluxer-reports
    # Data exports, which Fluxer itself expires after seven days, and makes again.
    - kind: object-storage
      bucket: fluxer-harvests
      backup: false
      expireAfterDays: 8
  env:
    FLUXER_APP_PROXY_PORT: "8080"
    TOKIO_WORKER_THREADS: "2"
    # Its discovery document, which the compose's edge Caddy served from the api.
    DISCOVERY_UPSTREAM_URL: "http://{{ companion.api.host }}:8080/.well-known/fluxer"
  # What Fluxer's thirteen services read, as the compose's `x-fluxer-env` anchor.
  # 🔴 Without its secrets, which would reach every service: each companion mounts the
  # ones it reads under /run/secrets and names them `FLUXER_<VAR>_FILE`, which Fluxer's
  # three config readers — TypeScript, Rust, Erlang — all honour. ⚠️ push and the media
  # proxy resolve EVERY `FLUXER_*_FILE` they are given: one naming a file not mounted
  # stops them. The api and the worker refuse to start without all sixteen.
  sharedEnv:
    FLUXER_ENV: production
    FLUXER_SELF_HOSTED: "true"
    FLUXER_BASE_DOMAIN: "{{ domain }}"
    FLUXER_PUBLIC_SCHEME: https
    FLUXER_PUBLIC_PORT: "443"
    FLUXER_APP_ENDPOINT: "https://{{ domain }}"
    FLUXER_MARKETING_ENDPOINT: "https://{{ domain }}"
    FLUXER_MEDIA_ENDPOINT: "https://{{ domain }}/media"
    FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT: "https://{{ domain }}/media"
    FLUXER_MEDIA_PROXY_UPLOAD_RELAY_ENDPOINT: "https://{{ domain }}/media"
    FLUXER_ADMIN_ENDPOINT: "https://{{ domain }}/admin"
    FLUXER_PASSKEY_RP_ID: "{{ domain }}"
    FLUXER_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS: "https://{{ domain }}"
    # Caddy, on the overlay, says who the client is; Fluxer trusts it from private
    # addresses only.
    FLUXER_TRUST_CLIENT_IP_HEADER: "true"
    # The compose names its services `api`, `media-proxy`: here they are the app's.
    FLUXER_INTERNAL_API_ENDPOINT: "http://{{ companion.api.host }}:8080"
    FLUXER_INTERNAL_MEDIA_PROXY_ENDPOINT: "http://{{ companion.media-proxy.host }}:8080"

    FLUXER_DATABASE_BACKEND: postgres
    FLUXER_POSTGRES_HOST: "{{ db.host }}"
    FLUXER_POSTGRES_PORT: "{{ db.port }}"
    FLUXER_POSTGRES_DATABASE: "{{ db.name }}"
    FLUXER_POSTGRES_USERNAME: "{{ db.user }}"

    # Its own Valkey and NATS, each behind a secret: the overlay is every app's, and
    # either would otherwise take any app's commands — Fluxer's jobs among them. The
    # Valkey URL holds its password: a file, the api's and the worker's.
    FLUXER_NATS_URL: "nats://{{ companion.nats.host }}:4222"
    FLUXER_NATS_JETSTREAM_URL: "nats://{{ companion.nats.host }}:4222"
    FLUXER_SVC_NATS_URL: "nats://{{ companion.nats.host }}:4222"
    FLUXER_SVC_SHARD_COUNT: "1"

    FLUXER_SEARCH_ENGINE: meilisearch
    FLUXER_SEARCH_URL: "http://{{ companion.meilisearch.host }}:7700"

    FLUXER_S3_ENDPOINT: "{{ s3.endpoint }}"
    FLUXER_S3_REGION: "{{ s3.region }}"
    FLUXER_S3_ACCESS_KEY_ID: "{{ s3.access_key }}"
    FLUXER_S3_FORCE_PATH_STYLE: "true"
    FLUXER_S3_BUCKET_CDN: fluxer
    FLUXER_S3_BUCKET_UPLOADS: fluxer-uploads
    FLUXER_S3_BUCKET_REPORTS: fluxer-reports
    FLUXER_S3_BUCKET_HARVESTS: fluxer-harvests
    # An export is handed through the api, never as a link to Garage, which nobody
    # outside reaches.
    FLUXER_API_PRESIGNED_HARVEST_DOWNLOADS_ENABLED: "false"

    FLUXER_LIVEKIT_ENABLED: "true"
    FLUXER_LIVEKIT_API_KEY: fluxer
    FLUXER_LIVEKIT_INTERNAL_URL: "http://{{ companion.livekit.host }}:7880"
    FLUXER_LIVEKIT_URL: "https://{{ domain }}:443/livekit"
    FLUXER_LIVEKIT_DEFAULT_REGION: '{"id":"default","name":"Default","emoji":"🌍","latitude":0,"longitude":0}'

    # Mail through Stalwart, as Fluxer itself: verification and notification mails.
    FLUXER_EMAIL_ENABLED: "true"
    FLUXER_EMAIL_PROVIDER: smtp
    FLUXER_EMAIL_DELIVERY: smtp
    FLUXER_EMAIL_FROM_EMAIL: "{{ smtp.from }}"
    FLUXER_EMAIL_FROM_NAME: Fluxer
    FLUXER_EMAIL_SMTP_HOST: "{{ smtp.host }}"
    FLUXER_EMAIL_SMTP_PORT: "{{ smtp.port }}"
    FLUXER_EMAIL_SMTP_USERNAME: "{{ smtp.user }}"
    FLUXER_EMAIL_SMTP_TLS_MODE: starttls

    # Set up from the first start: without it Fluxer opens its setup screen. The
    # administrators are Homelabus's roles (`access.admins`); people come through
    # PocketID, by email. ⚠️ It does not close the admin bootstrap — the api's
    # configuration does (`app_public.setup`).
    FLUXER_INSTANCE_SETUP_CONFIGURED: "true"
    FLUXER_ACCOUNT_IDENTITY: email
    # PocketID's issuer is reached at the ingress's address on the overlay — a private
    # one, which Fluxer refuses for an SSO provider unless told.
    FLUXER_SSO_ALLOW_PRIVATE_ADDRESSES: "true"

    # The private half is push's, the api's and the worker's file.
    FLUXER_VAPID_PUBLIC_KEY: "{{ secret.vapid:vapid-public }}"
    FLUXER_VAPID_EMAIL: "{{ smtp.from }}"
  companions:
    # In the order they start: Swarm has no `depends_on`, and each waits for the one
    # before to be healthy — the stores, then the services the api calls, then the api.
    - name: valkey
      image: { repo: valkey/valkey, tag: "9-alpine", digest: "sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b" }
      # Sessions, rate limits, locks — and `asset:deletion:queue`, which nothing
      # rebuilds: `noeviction`, or a full memory drops queue keys without a word.
      command: [docker-entrypoint.sh, valkey-server, /etc/valkey/valkey.conf]
      files:
        - path: /etc/valkey/valkey.conf
          content: |
            requirepass {{ secret.valkey-password:hex }}
            dir /data
            appendonly yes
            appendfsync everysec
            save ""
            maxmemory 192mb
            maxmemory-policy noeviction
      storage:
        # A lost one signs everybody out and orphans what was queued for deletion in
        # Garage: no data goes with it.
        - name: data
          path: /data
      memory: { reserve: 32M, limit: 256M }
      security:
        # 🔴 Started as root, its entrypoint runs `find . \! -user valkey -exec chown`
        # before dropping to valkey — and with every capability dropped, root cannot
        # enter the 0700 `appendonlydir` valkey made: the first start passed on an empty
        # volume, every later one exited (the lab, after a bucket restore). Started as
        # the image's own valkey (999:1000), the entrypoint skips it and needs nothing.
        user: "999:1000"
      healthcheck:
        test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$(sed -n 's/^requirepass //p' /etc/valkey/valkey.conf)\" ping | grep -q PONG"]
        intervalSecs: 10

    - name: nats
      image: { repo: nats, tag: "2.15-alpine", digest: "sha256:5fe569eab270ed1ac62e7974b80e86db130d33f464fe276beedd9003f50576dc" }
      # JetStream from a file only: the jobs (`JOBS`, seven days, and `JOBS_DLQ`).
      command: [nats-server, --config, /etc/nats/nats.conf]
      files:
        - path: /etc/nats/nats.conf
          content: |
            http_port: 8222
            authorization { token: "{{ secret.nats-token:hex }}" }
            jetstream {
              store_dir: /data
              max_memory_store: 64MB
              max_file_store: 10GB
            }
      storage:
        # 🔴 Jobs queued and delayed, which a lost store loses and nothing replays.
        - name: data
          path: /data
          backup: true
      memory: { reserve: 32M, limit: 256M }
      env:
        GOMEMLIMIT: 200MiB
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
        intervalSecs: 10

    - name: meilisearch
      image: { repo: getmeili/meilisearch, tag: "v1.56", digest: "sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4", signedBy: { github: meilisearch/meilisearch, workflow: publish-docker-images.yml } }
      env:
        MEILI_ENV: production
        MEILI_NO_ANALYTICS: "true"
        MEILI_UPGRADE_DB: "true"
        MEILI_MAX_INDEXING_MEMORY: 256mb
        MEILI_MAX_INDEXING_THREADS: "2"
        MEILI_LOG_LEVEL: WARN
        # Its key alone: Meilisearch has no `_FILE`, and its variables win over the file.
        MEILI_CONFIG_FILE_PATH: /etc/meilisearch/config.toml
      files:
        - path: /etc/meilisearch/config.toml
          content: 'master_key = "{{ secret.meili-key:hex }}"'
      storage:
        # Rebuilt from PostgreSQL: the admin indexes by themselves, the messages' with
        # `POST /admin/search/indexes/all/refreshes` — said in the guide.
        - name: data
          path: /meili_data
      memory: { reserve: 128M, limit: 1536M }
      # 🔴 Each document batch is first written to a temporary file: under a read-only
      # root every one was refused ("Read-only file system", a 500 to the api) while
      # the probe stayed green — the search silently empty. A request is 100 MB at
      # most, well inside the memory limit.
      security: { tmpfs: [/tmp] }
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
        intervalSecs: 10

    - name: snowflakes
      image: { repo: ghcr.io/fluxerapp/fluxer-snowflakes, tag: "2026.1027.190820", digest: "sha256:ba6d231b2ab535269ffe0d5c25fce9b4aae82938b0367db30df9fbfc8eba2b29" }
      # ⚠️ One: its worker id is its shard's, and a second would hand out the same ids.
      sharedEnv: true
      env: { FLUXER_SVC_NAME: snowflakes, FLUXER_SVC_MODE: combined, FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token, TOKIO_WORKER_THREADS: "2", MALLOC_ARENA_MAX: "2" }
      files:
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
      memory: { reserve: 32M, limit: 256M }
      healthcheck: &svc-probe
        test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
        intervalSecs: 10
        retries: 30
        startPeriodSecs: 60

    - name: users
      image: { repo: ghcr.io/fluxerapp/fluxer-users, tag: "2026.1027.190837", digest: "sha256:3a8be98697f46c7688568d78b7da1cba7df9b4ed2c59855a7a9dbe222aedfd7e" }
      sharedEnv: true
      # Every pool counted against PostgreSQL's 100, which every app shares: the
      # compose's 90 would have been all of them (`fluxer_cannot_exhaust_…`).
      env:
        FLUXER_SVC_NAME: users
        FLUXER_SVC_MODE: combined
        FLUXER_POSTGRES_MAX_CONNECTIONS: "4"
        FLUXER_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
        FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token
        FLUXER_PROFILE_PSEUDONYM_SECRET_FILE: /run/secrets/profile-pseudonym
        TOKIO_WORKER_THREADS: "2"
        MALLOC_ARENA_MAX: "2"
      files:
        - { path: /run/secrets/postgres-password, content: "{{ db.password }}" }
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
        - { path: /run/secrets/profile-pseudonym, content: "{{ secret.profile-pseudonym:hex }}" }
      memory: { reserve: 32M, limit: 256M }
      healthcheck: *svc-probe

    - name: gifs
      image: { repo: ghcr.io/fluxerapp/fluxer-gifs, tag: "2026.1027.190843", digest: "sha256:5aebd6773c11f0ecc163cd40c3d063cc824c80d51ac6d44557fe1c3d70f77e72" }
      sharedEnv: true
      env:
        FLUXER_SVC_NAME: gifs
        FLUXER_SVC_MODE: combined
        FLUXER_GIFS_SHARD_CACHE_MAX_BYTES: "134217728"
        FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token
        FLUXER_MEDIA_PROXY_SECRET_KEY_FILE: /run/secrets/media-proxy-key
        TOKIO_WORKER_THREADS: "2"
        MALLOC_ARENA_MAX: "2"
      files:
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
        - { path: /run/secrets/media-proxy-key, content: "{{ secret.media-proxy-key:hex }}" }
      memory: { reserve: 32M, limit: 256M }
      healthcheck: *svc-probe

    - name: messages
      image: { repo: ghcr.io/fluxerapp/fluxer-messages, tag: "2026.1027.190820", digest: "sha256:377987ff361857e653c55571569ef0c4c66d4e66bc1a215032253c4fa9aa3df2" }
      sharedEnv: true
      env:
        FLUXER_SVC_NAME: messages
        FLUXER_SVC_MODE: combined
        FLUXER_POSTGRES_MAX_CONNECTIONS: "4"
        FLUXER_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
        FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token
        TOKIO_WORKER_THREADS: "2"
        MALLOC_ARENA_MAX: "2"
      files:
        - { path: /run/secrets/postgres-password, content: "{{ db.password }}" }
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
      memory: { reserve: 32M, limit: 256M }
      healthcheck: *svc-probe

    - name: media-proxy
      image: { repo: ghcr.io/fluxerapp/fluxer-media-proxy, tag: "2026.1027.190818", digest: "sha256:b8bf52aaa0152d91c94b9f4aa4076b1e4aa963fff953bbe12adae961ffc78a31" }
      sharedEnv: true
      env:
        FLUXER_MEDIA_PROXY_PORT: "8080"
        FLUXER_MEDIA_PROXY_MODE: upload
        FLUXER_MEDIA_PROXY_STORAGE_BACKEND: s3
        FLUXER_MEDIA_PROXY_CORS_ALLOWED_ORIGINS: "https://{{ domain }}:443"
        FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_MAX_TOTAL_BYTES: "2147483648"
        FLUXER_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3-secret-key
        FLUXER_MEDIA_PROXY_SECRET_KEY_FILE: /run/secrets/media-proxy-key
        FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64_FILE: /run/secrets/upload-relay
        TOKIO_WORKER_THREADS: "4"
      files:
        - { path: /run/secrets/s3-secret-key, content: "{{ s3.secret_key }}" }
        - { path: /run/secrets/media-proxy-key, content: "{{ secret.media-proxy-key:hex }}" }
        - { path: /run/secrets/upload-relay, content: "{{ secret.upload-relay:base64 }}" }
      storage:
        # The relay's spool: an upload passes through it on its way to Garage.
        - name: tmp
          path: /tmp
      memory: { reserve: 64M, limit: 1G }
      healthcheck:
        test: ["CMD", "/usr/local/bin/fluxer-media-proxy", "healthcheck"]
        intervalSecs: 10

    - name: unfurl
      image: { repo: ghcr.io/fluxerapp/fluxer-unfurl, tag: "2026.1027.190906", digest: "sha256:6a2833ff6e4ccb0f0470a9f1f41c00fa909a634bb3cb2b466400ed57a1b3a92d" }
      sharedEnv: true
      env:
        FLUXER_SVC_NAME: unfurl
        FLUXER_SVC_MODE: combined
        FLUXER_MEDIA_PROXY_ENDPOINT: "http://{{ companion.media-proxy.host }}:8080"
        # Signs its fetches of a fediverse link: a server under authorized fetch
        # shows no preview to an unsigned one. The api serves the public half.
        FLUXER_ACTIVITYPUB_SIGNING_KEY_BASE64_FILE: /run/secrets/activitypub
        FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token
        FLUXER_MEDIA_PROXY_SECRET_KEY_FILE: /run/secrets/media-proxy-key
        TOKIO_WORKER_THREADS: "2"
        MALLOC_ARENA_MAX: "2"
      files:
        - { path: /run/secrets/activitypub, content: "{{ secret.activitypub:rsa }}" }
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
        - { path: /run/secrets/media-proxy-key, content: "{{ secret.media-proxy-key:hex }}" }
      memory: { reserve: 32M, limit: 256M }
      healthcheck: *svc-probe

    - name: api
      image: &api-image { repo: ghcr.io/fluxerapp/fluxer-api, tag: "2026.1027.190743", digest: "sha256:f78ceb022013796eee6150047aec263745a713f615b8c64e6aaa7a0d1190575e" }
      sharedEnv: true
      # 🔴 Fluxer keeps its sign-in in its database, set from its admin panel: no
      # variable and no file reach it. The api is started through this script, which
      # writes the instance's configuration once its operator socket answers — the
      # socket `rexctl` drives, which serves `/admin/*` to whoever is in the container.
      # It runs at every start, so the configuration follows the manifest; refused,
      # the api never reads healthy, and its log says what Fluxer answered.
      command: [docker-entrypoint.sh, node, /run/hlb/fluxer-start.mjs]
      env:
        FLUXER_API_PORT: "8080"
        # 🔴 Until an administrator is bootstrapped Fluxer writes a token in its log,
        # and the registration presenting it becomes one — past closed sign-ups. Its
        # own is never shown; the configuration below then closes the bootstrap and
        # burns it (found on the lab: still "unused" after an administrator was made).
        FLUXER_SETUP_TOKEN_FILE: /run/secrets/setup-token
        FLUXER_POSTGRES_MAX_CONNECTIONS: "8"
        FLUXER_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED: "true"
        NODE_OPTIONS: --max-old-space-size-percentage=60
        FLUXER_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
        FLUXER_KV_URL_FILE: /run/secrets/kv-url
        FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token
        FLUXER_SEARCH_API_KEY_FILE: /run/secrets/search-key
        FLUXER_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3-secret-key
        FLUXER_LIVEKIT_API_SECRET_FILE: /run/secrets/livekit-secret
        FLUXER_EMAIL_SMTP_PASSWORD_FILE: /run/secrets/smtp-password
        FLUXER_SUDO_MODE_SECRET_FILE: /run/secrets/sudo-mode
        FLUXER_CONNECTION_INITIATION_SECRET_FILE: /run/secrets/connection-initiation
        FLUXER_PROFILE_PSEUDONYM_SECRET_FILE: /run/secrets/profile-pseudonym
        FLUXER_GATEWAY_RPC_AUTH_TOKEN_FILE: /run/secrets/gateway-rpc
        FLUXER_MEDIA_PROXY_SECRET_KEY_FILE: /run/secrets/media-proxy-key
        FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64_FILE: /run/secrets/upload-relay
        FLUXER_ADMIN_SECRET_KEY_BASE_FILE: /run/secrets/admin-key-base
        FLUXER_ADMIN_OAUTH_CLIENT_SECRET_FILE: /run/secrets/admin-oauth
        FLUXER_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid-private
      files:
        - { path: /run/secrets/setup-token, content: "{{ secret.setup-token:hex }}" }
        # 🔴 What Fluxer encrypts and signs with. Several can never change once it has
        # started — the search, storage, voice and push keys —: the vault keeps each.
        # The worker's list is this one.
        - { path: /run/secrets/postgres-password, content: "{{ db.password }}" }
        - { path: /run/secrets/kv-url, content: "redis://:{{ secret.valkey-password:hex }}@{{ companion.valkey.host }}:6379/0" }
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
        - { path: /run/secrets/search-key, content: "{{ secret.meili-key:hex }}" }
        - { path: /run/secrets/s3-secret-key, content: "{{ s3.secret_key }}" }
        - { path: /run/secrets/livekit-secret, content: "{{ secret.livekit-secret:hex }}" }
        - { path: /run/secrets/smtp-password, content: "{{ smtp.password }}" }
        - { path: /run/secrets/sudo-mode, content: "{{ secret.sudo-mode:hex }}" }
        - { path: /run/secrets/connection-initiation, content: "{{ secret.connection-initiation:hex }}" }
        - { path: /run/secrets/profile-pseudonym, content: "{{ secret.profile-pseudonym:hex }}" }
        - { path: /run/secrets/gateway-rpc, content: "{{ secret.gateway-rpc:hex }}" }
        - { path: /run/secrets/media-proxy-key, content: "{{ secret.media-proxy-key:hex }}" }
        - { path: /run/secrets/upload-relay, content: "{{ secret.upload-relay:base64 }}" }
        - { path: /run/secrets/admin-key-base, content: "{{ secret.admin-key-base:hex }}" }
        - { path: /run/secrets/admin-oauth, content: "{{ secret.admin-oauth:hex }}" }
        - { path: /run/secrets/vapid-private, content: "{{ secret.vapid:vapid-private }}" }
        # 🔴 `attachment_decay` off: by default Fluxer DELETES an attachment by its size
        # — three years up to 5 MB, fourteen days at 500 MB, renewed when viewed near
        # its end. The household's files are its own, in its Garage and backed up:
        # nothing disappears by itself (decided 2026-10-27). Off, its expiry job skips
        # every attachment, those already dated included.
        - path: /run/hlb/fluxer-instance.json
          content: |
            {
              "app_public": { "setup": { "configured": true } },
              "media": { "attachment_decay": { "enabled": false } },
              "registration": { "mode": "closed", "admin_registration_urls_enabled": false },
              "sso": {
                "enabled": true,
                "enforced": true,
                "display_name": "PocketID",
                "button_label": "Sign in with PocketID",
                "issuer": "{{ oidc.issuer }}",
                "client_id": "{{ oidc.client_id }}",
                "client_secret": "{{ oidc.client_secret }}",
                "scope": "openid email profile",
                "auto_provision": true
              }
            }
        - path: /run/hlb/fluxer-start.mjs
          content: |
            // Homelabus starts Fluxer's API through this: the API, then — once its
            // operator socket answers — the instance's configuration, which Fluxer
            // keeps in its database. Healthy only once it is accepted.
            import {spawn, execFileSync} from 'node:child_process';
            import {existsSync, readFileSync, rmSync, writeFileSync} from 'node:fs';

            const RELAY = '/usr/src/app/fluxer_api/bin/operator-relay.mjs';
            const SOCKET = '/run/fluxer/operator.sock';
            const CONFIGURED = '/tmp/hlb-configured';
            rmSync(CONFIGURED, {force: true});

            const api = spawn('node', ['dist/AppEntrypoint.js'], {stdio: 'inherit'});
            for (const signal of ['SIGTERM', 'SIGINT']) process.on(signal, () => api.kill(signal));
            api.on('exit', (code, signal) => process.exit(code ?? (signal ? 1 : 0)));

            // The configuration goes on standard input: it holds the client secret,
            // which a command line would show to every account of the node.
            const relay = (request) =>
              JSON.parse(execFileSync('node', [RELAY], {input: JSON.stringify(request), encoding: 'utf8'}));
            const body = JSON.parse(readFileSync('/run/hlb/fluxer-instance.json', 'utf8'));
            for (let attempt = 1; ; attempt++) {
              if (existsSync(SOCKET)) {
                try {
                  const r = relay({target: 'operator', method: 'PATCH', path: '/admin/instance/config', body});
                  if (r.status >= 200 && r.status < 300) {
                    writeFileSync(CONFIGURED, '');
                    console.log('homelabus: the instance is configured — PocketID, sign-ups closed');
                    break;
                  }
                  console.error(`homelabus: Fluxer refused the configuration (${r.status}): ${JSON.stringify(r.body ?? r.relay_error).slice(0, 800)}`);
                } catch (e) {
                  console.error(`homelabus: ${e.message}`);
                }
              }
              if (attempt >= 150) {
                console.error('homelabus: the instance could not be configured in five minutes; stopping');
                api.kill('SIGTERM');
                break;
              }
              await new Promise((r) => setTimeout(r, 2000));
            }
        - path: /run/hlb/fluxer-admin.mjs
          content: |
            // `node /run/hlb/fluxer-admin.mjs grant|revoke <PocketID id>`, run by
            // Homelabus as roles change: Fluxer's administrator is the `*` ACL on the
            // account, which no claim sets. Exit 0 once done, 3 when the person has
            // no account yet — they never signed in —, retried by Homelabus. Only `*`
            // is touched: a finer right given by hand stays.
            import {execFileSync} from 'node:child_process';
            import {readFileSync} from 'node:fs';

            const RELAY = '/usr/src/app/fluxer_api/bin/operator-relay.mjs';
            const [verb, subject] = process.argv.slice(2);
            if (!['grant', 'revoke'].includes(verb) || !subject) {
              console.error('usage: grant|revoke <subject>');
              process.exit(2);
            }
            // The provider id Fluxer binds a subject under is its issuer.
            const issuer = JSON.parse(readFileSync('/run/hlb/fluxer-instance.json', 'utf8')).sso.issuer;
            const call = (request) => {
              const r = JSON.parse(
                execFileSync('node', [RELAY], {input: JSON.stringify({target: 'operator', ...request}), encoding: 'utf8'}),
              );
              if (r.status < 200 || r.status >= 300) {
                console.error(`${request.method} ${request.path}: ${r.status} ${JSON.stringify(r.body ?? r.relay_error).slice(0, 400)}`);
                process.exit(1);
              }
              return r.body;
            };
            const found = call({method: 'GET', path: '/admin/sso-identities', query: {provider_id: issuer, subject}});
            if (!found?.sso_identity) process.exit(3);
            const id = found.sso_identity.user_id;
            const user = call({method: 'GET', path: `/admin/users/${id}`}).users?.[0];
            if (!user) process.exit(3);
            const acls = new Set(user.acls ?? []);
            if (verb === 'grant') acls.add('*');
            else acls.delete('*');
            call({method: 'PUT', path: `/admin/users/${id}/acls`, body: {acls: [...acls]}});
      memory: { reserve: 512M, limit: 2560M }
      # Under a read-only root: its operator socket and the mark the probe reads.
      security: { tmpfs: [/tmp, /run/fluxer] }
      healthcheck:
        # Healthy once configured, never before: the route waits for it.
        test: ["CMD-SHELL", "test -f /tmp/hlb-configured && bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
        intervalSecs: 10
        retries: 30
        startPeriodSecs: 120

    - name: worker
      image: *api-image
      sharedEnv: true
      command: [docker-entrypoint.sh, node, dist/WorkerEntrypoint.js]
      env:
        FLUXER_API_WORKER_MODE: all_lanes
        FLUXER_API_WORKER_ENABLE_CRON_SCHEDULER: "true"
        FLUXER_POSTGRES_MAX_CONNECTIONS: "6"
        NODE_OPTIONS: --max-old-space-size-percentage=55
        FLUXER_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
        FLUXER_KV_URL_FILE: /run/secrets/kv-url
        FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token
        FLUXER_SEARCH_API_KEY_FILE: /run/secrets/search-key
        FLUXER_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3-secret-key
        FLUXER_LIVEKIT_API_SECRET_FILE: /run/secrets/livekit-secret
        FLUXER_EMAIL_SMTP_PASSWORD_FILE: /run/secrets/smtp-password
        FLUXER_SUDO_MODE_SECRET_FILE: /run/secrets/sudo-mode
        FLUXER_CONNECTION_INITIATION_SECRET_FILE: /run/secrets/connection-initiation
        FLUXER_PROFILE_PSEUDONYM_SECRET_FILE: /run/secrets/profile-pseudonym
        FLUXER_GATEWAY_RPC_AUTH_TOKEN_FILE: /run/secrets/gateway-rpc
        FLUXER_MEDIA_PROXY_SECRET_KEY_FILE: /run/secrets/media-proxy-key
        FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64_FILE: /run/secrets/upload-relay
        FLUXER_ADMIN_SECRET_KEY_BASE_FILE: /run/secrets/admin-key-base
        FLUXER_ADMIN_OAUTH_CLIENT_SECRET_FILE: /run/secrets/admin-oauth
        FLUXER_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid-private
      files:
        - { path: /run/secrets/postgres-password, content: "{{ db.password }}" }
        - { path: /run/secrets/kv-url, content: "redis://:{{ secret.valkey-password:hex }}@{{ companion.valkey.host }}:6379/0" }
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
        - { path: /run/secrets/search-key, content: "{{ secret.meili-key:hex }}" }
        - { path: /run/secrets/s3-secret-key, content: "{{ s3.secret_key }}" }
        - { path: /run/secrets/livekit-secret, content: "{{ secret.livekit-secret:hex }}" }
        - { path: /run/secrets/smtp-password, content: "{{ smtp.password }}" }
        - { path: /run/secrets/sudo-mode, content: "{{ secret.sudo-mode:hex }}" }
        - { path: /run/secrets/connection-initiation, content: "{{ secret.connection-initiation:hex }}" }
        - { path: /run/secrets/profile-pseudonym, content: "{{ secret.profile-pseudonym:hex }}" }
        - { path: /run/secrets/gateway-rpc, content: "{{ secret.gateway-rpc:hex }}" }
        - { path: /run/secrets/media-proxy-key, content: "{{ secret.media-proxy-key:hex }}" }
        - { path: /run/secrets/upload-relay, content: "{{ secret.upload-relay:base64 }}" }
        - { path: /run/secrets/admin-key-base, content: "{{ secret.admin-key-base:hex }}" }
        - { path: /run/secrets/admin-oauth, content: "{{ secret.admin-oauth:hex }}" }
        - { path: /run/secrets/vapid-private, content: "{{ secret.vapid:vapid-private }}" }
      memory: { reserve: 384M, limit: 2G }
      # Under a read-only root: the heartbeat its probe reads.
      security: { tmpfs: [/tmp] }
      healthcheck:
        test: ["CMD-SHELL", "find /tmp/fluxer-worker-heartbeat -newermt '-30 seconds' | grep -q ."]
        intervalSecs: 10
        retries: 30
        startPeriodSecs: 90

    - name: gateway
      image: { repo: ghcr.io/fluxerapp/fluxer-gateway, tag: "2026.1027.190817", digest: "sha256:fc2c27be1ca4070ca89e869fd711147da81b63c025e3b1ec2affe8c1c8c26577" }
      sharedEnv: true
      env:
        FLUXER_GATEWAY_PORT: "8080"
        FLUXER_GATEWAY_MEDIA_PROXY_ENDPOINT: "https://{{ domain }}/media"
        FLUXER_GATEWAY_STATIC_CDN_ENDPOINT: "https://{{ domain }}"
        FLUXER_ERLANG_COOKIE_FILE: /run/secrets/erlang-cookie
        FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token
        FLUXER_GATEWAY_RPC_AUTH_TOKEN_FILE: /run/secrets/gateway-rpc
        RELX_OUT_FILE_PATH: /tmp
      files:
        - { path: /run/secrets/erlang-cookie, content: "{{ secret.erlang-cookie:hex }}" }
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
        - { path: /run/secrets/gateway-rpc, content: "{{ secret.gateway-rpc:hex }}" }
      memory: { reserve: 256M, limit: 1G }
      # Under a read-only root: the release's start renders its `vm.args` there
      # (`RELX_OUT_FILE_PATH`), where it would write into the release itself.
      security: { tmpfs: [/tmp] }
      healthcheck:
        test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health/ready HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
        intervalSecs: 10
        retries: 30
        startPeriodSecs: 90

    - name: push
      image: { repo: ghcr.io/fluxerapp/fluxer-push, tag: "2026.1027.190820", digest: "sha256:6db795e9dabbc503a8379a7d5d39a19a8fc59fda207a0047cecd714a1763fd55" }
      sharedEnv: true
      env:
        FLUXER_NATS_AUTH_TOKEN_FILE: /run/secrets/nats-token
        FLUXER_GATEWAY_RPC_AUTH_TOKEN_FILE: /run/secrets/gateway-rpc
        FLUXER_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid-private
        TOKIO_WORKER_THREADS: "2"
        MALLOC_ARENA_MAX: "2"
      files:
        - { path: /run/secrets/nats-token, content: "{{ secret.nats-token:hex }}" }
        - { path: /run/secrets/gateway-rpc, content: "{{ secret.gateway-rpc:hex }}" }
        - { path: /run/secrets/vapid-private, content: "{{ secret.vapid:vapid-private }}" }
      memory: { reserve: 32M, limit: 256M }
      healthcheck:
        test: ["CMD", "/usr/local/bin/fluxer-push", "healthcheck"]
        intervalSecs: 10
        retries: 30
        startPeriodSecs: 60

    - name: static
      image: { repo: ghcr.io/fluxerapp/fluxer-static, tag: "2026.1027.190837", digest: "sha256:43044318df4c23499c9d8234841f8aa7a1080c27e0750c166123c0a0a360ef1a" }
      memory: { reserve: 32M, limit: 256M }
      # A Caddy: its autosaved configuration and its instance id, nothing kept.
      security: { tmpfs: [/config, /data] }
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/avatars/0.png"]
        intervalSecs: 10

    - name: admin
      image: { repo: ghcr.io/fluxerapp/fluxer-admin, tag: "2026.1027.190827", digest: "sha256:ce465b52287c2d660458770714e589c18edbfbbe233d90e6ef4c21647cae4937" }
      sharedEnv: true
      env:
        FLUXER_ADMIN_PORT: "8080"
        FLUXER_ADMIN_BASE_PATH: /admin
        FLUXER_API_ENDPOINT: "http://{{ companion.api.host }}:8080"
        FLUXER_STATIC_CDN_ENDPOINT: "https://{{ domain }}"
        FLUXER_ADMIN_SECRET_KEY_BASE_FILE: /run/secrets/admin-key-base
        FLUXER_ADMIN_OAUTH_CLIENT_SECRET_FILE: /run/secrets/admin-oauth
        TOKIO_WORKER_THREADS: "2"
        MALLOC_ARENA_MAX: "2"
      files:
        - { path: /run/secrets/admin-key-base, content: "{{ secret.admin-key-base:hex }}" }
        - { path: /run/secrets/admin-oauth, content: "{{ secret.admin-oauth:hex }}" }
      memory: { reserve: 64M, limit: 256M }
      healthcheck:
        test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
        intervalSecs: 10
        retries: 30
        startPeriodSecs: 60

    - name: livekit
      image: { repo: livekit/livekit-server, tag: "v1.13.11", digest: "sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20" }
      # 🔴 Calls do not go through Caddy: the media arrives on 7881/tcp and
      # 7882/udp, straight to this node. The router forwards them to ONE machine,
      # the ingress's — the guide says which ports; here, where it is.
      nodeLabel: hlb.ingress
      tier: light
      # Its configuration as a file, since it holds the key: the image's Entrypoint,
      # given the file. Never `key_file`, which LiveKit refuses readable by all — as
      # Swarm mounts every secret.
      command: [/livekit-server, --config, /etc/livekit/livekit.yaml]
      env:
        GOMEMLIMIT: 435MiB
      files:
        # It announces the address STUN finds — the house's public one — and that
        # alone: a client inside the house reaches it only through a router that
        # loops back (hairpin NAT). LiveKit says so at start, "could not validate
        # external IP", when the one it runs behind does not — the guide says it.
        # No second, local address can be added: its rewrite rules REPLACE a
        # candidate's address (mediatransportutil, `SetNAT1To1AddressRewriteRules`)
        # and `node_ip` holds one. The site itself, reached by its public name from
        # inside, needs the same loop — or a house DNS, which then leaves calls alone.
        # 🔴 `ips` never the overlay's: offered one candidate per interface, LiveKit
        # answered a call's checks from its `hlb_platform` address (10.0.1.x), which
        # leaves the node untranslated, and no client took them (the lab: requests in,
        # "responsesReceived: 0"). The media goes by `docker_gwbridge`, the host-mode
        # ports' own. Swarm takes its overlays from 10.0.0.0/8 (the default pool,
        # which `cluster init` keeps).
        - path: /etc/livekit/livekit.yaml
          content: |
            port: 7880
            log_level: info
            keys:
              fluxer: "{{ secret.livekit-secret:hex }}"
            rtc:
              tcp_port: 7881
              udp_port: 7882
              use_external_ip: true
              ips:
                excludes:
                  - 10.0.0.0/8
              stun_servers:
                - stun.l.google.com:19302
                - stun1.l.google.com:19302
            webhook:
              api_key: fluxer
              urls:
                - http://{{ companion.api.host }}:8080/webhooks/livekit
      memory: { reserve: 128M, limit: 512M }
      security:
        publishedPorts: [7881, "7882/udp"]
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
        intervalSecs: 10
  ingress:
    - host: "{{ domain }}"
      port: 8080
      # No Anubis: the desktop and phone apps solve no challenge, and the gateway and
      # LiveKit are websockets.
      chain: [caddy-front, caddy-back]
      expose: after-guide
      # The compose's edge Caddy, path for path.
      paths:
        - { prefix: /api, companion: api, port: 8080 }
        - { prefix: /gateway, companion: gateway, port: 8080 }
        - { prefix: /media, companion: media-proxy, port: 8080 }
        - { prefix: /livekit, companion: livekit, port: 7880 }
        - { prefix: /admin, companion: admin, port: 8080 }
        - { prefix: /.well-known/fluxer, companion: api, port: 8080, keepPrefix: true }
        - { prefix: /.well-known/webfinger, companion: api, port: 8080, keepPrefix: true }
        - { prefix: /web, companion: static, port: 8080, keepPrefix: true }
        - { prefix: /emoji, companion: static, port: 8080, keepPrefix: true }
        - { prefix: /libs, companion: static, port: 8080, keepPrefix: true }
        - { prefix: /avatars, companion: static, port: 8080, keepPrefix: true }
        - { prefix: /badges, companion: static, port: 8080, keepPrefix: true }
        - { prefix: /desktop, companion: static, port: 8080, keepPrefix: true }
  access:
    admins:
      level: admin
      means: Fluxer's administration — every account, community and report
      apply:
        service: api
        grant: [node, /run/hlb/fluxer-admin.mjs, grant, "{{ person.sub }}"]
        revoke: [node, /run/hlb/fluxer-admin.mjs, revoke, "{{ person.sub }}"]
  swarm:
    memory: { reserve: 32M, limit: 256M }
    replicas: 1
    tier: heavy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/_ready"]
      intervalSecs: 15
  update:
    # 🔴 Fifteen releases in three days, thirteen images moving together, a schema
    # each start migrates: approved by hand, after a backup, from the catalog.
    channel: pin
