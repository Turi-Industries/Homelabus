apiVersion: hlb/v1
kind: App
metadata:
  name: jellyfin
  hlb: ">=0.4.0"
  criticality: normal
  displayName: Jellyfin
  category: media
  homepage: https://jellyfin.org
spec:
  # 12 — rehearsed on 2026-11-01 on a 10.11.11 volume through this start: its
  # migrations, the administrator and an account still signing in, the wizard below
  # run on an empty one. 12.0 removes alternative versions of a film it did not merge
  # by hand until a library scan, which Jellyfin schedules itself every twelve hours.
  image: { repo: jellyfin/jellyfin, tag: "12.4", digest: "sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771" }
  requires:
    # Through MaxRink's SSO plugin (`downloads` below), set by the guide. Its callback
    # follows the path a sign-in began at — `/sso/OID/start/` comes back to
    # `redirect`, `/sso/OID/p/` to `r` (6.1.0.0) — so both are declared. TVs and the
    # phone apps cannot follow a redirect: they sign in by Quick Connect, approved from
    # a browser already signed in.
    - kind: sso
      mode: native
      redirectPaths: ["/sso/OID/redirect/PocketID", "/sso/OID/r/PocketID"]

    # Configuration and internal database. SQLite: the flag imposes the snapshot backup
    # method — a SQLite file copied hot does not restore.
    - kind: storage
      name: config
      path: /config
      tier: local
      backup: true
      sqlite: true

    # ⚠️ Transcoding cache: NOT backed up, deliberately. It rebuilds itself, it can
    # weigh tens of gigabytes, and including it would drown the restic repository in
    # disposable data at the expense of the irreplaceable.
    - kind: storage
      name: cache
      path: /cache
      tier: local
      backup: false

    # 🔴 The media library goes on the NAS, not on a local volume. It is the only
    # storage in the catalog that warrants it: the volume exceeds what a node SSD
    # holds, and the files are already backed up on the NAS side.
    #
    # ⚠️ NFS is forbidden for databases — here there are only files read
    # sequentially, which is exactly what it is good for.
    - kind: storage
      name: media
      path: /media
      tier: nfs
      backup: false
  ingress:
    - host: "{{ domain }}"
      port: 8096
      # No Anubis: a proof-of-work would break every non-browser client.
      chain: [caddy-front, caddy-back]
      # 🔴 Private. The SSO is a button beside Jellyfin's own password form, which stays
      # — the administrator's recovery sign-in goes through it — and a public exposure
      # would leave that form facing the internet.
      expose: private
      # A wrong password is an `AuthenticationException`, which Jellyfin answers 401
      # (`ExceptionMiddleware`, 10.11 and 12.4). Its routes ignore case, and so does Caddy's `path`.
      authRoutes:
        - paths: [/Users/AuthenticateByName]
          failsWith: 401
  security:
    readOnlyRootfs: false
    capAdd: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
  swarm:
    # Transcoding runs ffmpeg inside this container.
    memory: { reserve: 256M, limit: 2G }
    # 🔴 A single instance: the database is a local SQLite. Two replicas would hold
    # two diverging libraries, and playback progress would jump from one episode to
    # another depending on which node answered.
    replicas: 1
    # Transcoding is the heaviest load in the catalog.
    tier: heavy
    healthcheck:
      # ⚠️ Lenient on purpose: while a new version migrates its database, `/health`
      # answers 200 `Degraded` and every sign-in 503. Requiring `Healthy` would have
      # Swarm kill the task mid-migration — 12.0's first start rewrites the library.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
  update:
    channel: minor
  # Sign-in through PocketID, by MaxRink's fork of the SSO plugin: Jellyfin takes no
  # OIDC into its core (jellyfin/jellyfin#17271), 9p4's original is archived, and
  # K0lin's fork starts an account link unauthenticated. Loaded from any directory of
  # `plugins/` at start, its settings kept apart in `plugins/configurations/`.
  downloads:
    - url: https://github.com/MaxRink/jellyfin-plugin-sso/releases/download/v6.1.0.0/sso-auth_6.1.0.0.zip
      sha256: 6311d6b16e89a91e44ce9b5a32c09d28eda292a11b75cd6b942d7bc62664cd00
      storage: config
      # Unversioned: Jellyfin loads it as well, and an update replaces it whole rather
      # than leaving the old version's directory to be loaded beside it.
      into: plugins/SSO-Auth
      unzip: true
  assertions:
    - id: wizard-done
      holds: nobody becomes Jellyfin's administrator through its first-run wizard
      check:
        type: http
        path: /System/Info/Public
        pointer: /StartupWizardCompleted
        equals: true
  # Every allowed role signs in through PocketID; the plugin makes the account at the
  # first sign-in and sets its administrator flag from `hlb_jellyfin` at each one — one
  # role to the plugin, `user` or `admin`, and its `AdminRoles` names `admin`.
  access:
    admins:
      level: admin
      means: Jellyfin's administration — its accounts, libraries and settings
    claims:
      hlb_jellyfin: { byLevel: { user: user, admin: admin } }
    # 🔴 PocketID stops a removed person's next sign-in only: their TV's and phone's
    # tokens keep working until the account is disabled (measured, 12.4 + plugin
    # 6.1.0.0), and the plugin never enables one again. The plugin's links say whose
    # account is whose; `admin`, linked to nobody, is never touched.
    accounts:
      apply:
        type: http
        signIn: admin-password
        headers:
          Authorization: 'MediaBrowser Client="Homelabus", Device="Homelabus", DeviceId="homelabus-recovery-proof", Version="1", Token="{{ token }}"'
        links:
          path: /Plugins/505ce9d1-d916-42fa-86ca-673ef241d7df/Configuration
          pointer: /OidConfigs/PocketID/CanonicalLinks
        read: { path: "/Users/{{ account }}", pointer: /Policy }
        disabled: /IsDisabled
        write: { verb: POST, path: "/Users/{{ account }}/Policy" }
  # Its administrator, made by the guide's first-run step: the way in when PocketID is
  # down, and the account that sets the SSO provider.
  recovery:
    - secret: admin-password
      username: admin
      # 401 to a refusal; 400 to a client that does not name itself (12.4; 10.11.11
      # answered it 401). One
      # device id: each sign-in replaces the last one's token instead of adding a device.
      proof:
        path: /Users/AuthenticateByName
        body: '{"Username":"{{ username }}","Pw":"{{ password }}"}'
        headers:
          Authorization: 'MediaBrowser Client="Homelabus", Device="Homelabus", DeviceId="homelabus-recovery-proof", Version="1"'
        pointer: /AccessToken
