# What the deployment alone does not cover.
steps:
  - id: dns-record
    title: Create the DNS record
    phase: pre-install
    severity: blocking
    body: |
      At your registrar, point {{ domain }} at the cluster.

      If a wildcard *.{{ base_domain }} already exists, there is nothing to do.
    verify:
      type: dns
      record: "{{ domain }}"
    recheck: 24h

  - id: nfs-media
    title: Check the media library's NFS share
    phase: pre-install
    severity: blocking
    body: |
      The `jellyfin-media` volume must point at the NAS's NFS share.

      ⚠️ Without it, Jellyfin starts perfectly and presents an EMPTY library.
      Nothing says the mount is missing: you assume an indexing problem and
      go looking in the wrong place.

      Check from a node:
        showmount -e <nas>
        mount | grep media

  - id: first-account
    title: The administrator account
    phase: post-install
    severity: blocking
    body: |
      Jellyfin's first-run wizard makes its first visitor the administrator, so
      it is run at the install, before anyone reaches it: the administrator is
      `admin`, with a generated password —

        hlb secret-get jellyfin-admin-password

      Everyone else signs in through PocketID; this account is the way in
      when PocketID is down, and its password opens every library: it is in
      the emergency vault, keep it nowhere else.
    deeplink: "https://{{ domain }}/web/#/login.html"
    automate:
      - method: api
        probe:
          path: /System/Info/Public
          pointer: /StartupWizardCompleted
          equals: "true"
        # The wizard's own calls, in its order (10.11.11, unchanged in 12.4). Remote access stays on:
        # every request reaches Jellyfin through Caddy, never from its own network.
        calls:
          - verb: POST
            path: /Startup/Configuration
            body: '{"UICulture":"en-US","MetadataCountryCode":"US","PreferredMetadataLanguage":"en"}'
          - { verb: GET, path: /Startup/User }
          - verb: POST
            path: /Startup/User
            body: '{"Name":"admin","Password":"{{ secret.admin-password }}"}'
          - verb: POST
            path: /Startup/RemoteAccess
            body: '{"EnableRemoteAccess":true,"EnableAutomaticPortMapping":false}'
          - { verb: POST, path: /Startup/Complete }
    verify:
      type: http
      # The wizard's last call sets it, after the administrator (10.11.11, 12.4); `/health`
      # answered with the wizard still open to its first visitor.
      url: "https://{{ domain }}/System/Info/Public"
      expectJson: { pointer: /StartupWizardCompleted, equals: "true" }

  - id: sso-provider
    title: Sign-in through PocketID
    phase: post-install
    after: [first-account]
    body: |
      The SSO plugin is given PocketID as its provider, by the administrator:
      every allowed role signs in with "Sign in with PocketID" on the sign-in
      page, its account made at the first sign-in. TVs and phones sign in by
      Quick Connect, approved from a browser already signed in.

      ⚠️ It is written once. Writing it again replaces the provider whole,
      with each account's link to its PocketID identity, after which nobody
      signs in: a client secret or an identity provider changed later is NOT
      carried to Jellyfin by this step.
    automate:
      - method: api
        signIn: admin-password
        # The proof's own device: Jellyfin keeps one token per device, so the step
        # replaces the nightly proof's instead of adding a device.
        headers:
          Authorization: 'MediaBrowser Client="Homelabus", Device="Homelabus", DeviceId="homelabus-recovery-proof", Version="1", Token="{{ token }}"'
        # Anonymous, and the names alone: reading the provider is the administrator's.
        probe:
          path: /sso/OID/GetNames
          pointer: /0
          equals: '"PocketID"'
        # Every PocketID person reaching the plugin is let in (`Roles` empty):
        # PocketID's own restriction of the client to the allowed roles is the gate.
        # `DisableUsernameAccountAdoption`: a PocketID person named `admin` must not
        # take the administrator's account. Never `CanonicalLinks` here — sent, it
        # would replace every account's link.
        calls:
          - verb: POST
            path: /sso/OID/Add/PocketID
            body: '{"OidEndpoint":"{{ oidc.issuer }}","OidClientId":"{{ oidc.client_id }}","OidSecret":"{{ oidc.client_secret }}","Enabled":true,"EnableAuthorization":true,"EnableAllFolders":true,"EnabledFolders":[],"Roles":[],"AdminRoles":["admin"],"PreserveAdminPermissions":false,"RoleClaim":"hlb_jellyfin","OidScopes":[],"DisableUsernameAccountAdoption":true,"SchemeOverride":"https"}'
    verify:
      type: http
      url: "https://{{ domain }}/sso/OID/GetNames"
      expectJson: { pointer: /0, equals: '"PocketID"' }

  - id: remote-access
    title: Decide on access outside the VPN
    phase: post-install
    severity: recommended
    after: [first-account]
    body: |
      Jellyfin is exposed PRIVATELY: reachable from the VPN only.

      Making it public would amount to putting its sign-in form facing the
      internet, without the identity provider to cover it. If you want to
      watch from elsewhere, the VPN is the right answer — Jellyfin clients
      cope with it very well.
